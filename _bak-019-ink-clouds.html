<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>墨云</title>
<style>
  html,body{margin:0;height:100%;background:#0a0c10;overflow:hidden}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);
        font:500 11px/1.5 ui-monospace,Consolas,monospace;
        color:rgba(190,205,225,.30);letter-spacing:.08em;pointer-events:none;transition:opacity .6s}
</style>
</head>
<body data-chrome="off">
<canvas id="c"></canvas>
<div id="hint">等待第一句…</div>
<script>
"use strict";
/* ============================================================================
   019 · 墨云歌词 —— 字是墨的"沉积区"，不是墨画出来的形状

   和 001-010 全都不同：这里根本没有"点"被画出来。
   画面是一团**标量场**（metaball 密度场），每帧在低分辨率网格上重算一次，
   再放大成水墨的浓淡。所以墨是连续的、会互相融合的 —— 粒子做不出这种效果。

   机制的关键：字形点云是一圈**捕获区**。
   墨点飘到笔画附近就被拽住、减速、沉积下来，密度越积越高；
   远处的墨点只受湍流和缓慢的向心漂移，一直是稀薄的云气。
   于是"字"不是被描出来的，而是**墨自己愿意待的地方**——
   笔画处最黑最实，四周是翻涌的淡云。换句时捕获区整块换掉，
   旧笔画上的墨失去约束，重新化成云飘走。

   性能：绝不逐点画。整帧只有一次 putImageData + 一次 drawImage 放大。
   ========================================================================== */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });
const hint = document.getElementById('hint');

let W = 0, H = 0, DPR = 1;

/* ---------------- 状态 ---------------- */
let lines = [];
let accent = [120, 160, 220];
let curIdx = -1, brewIdx = -1, lastT = -1;
let clockT = 0, clockAt = 0, playing = false;
let pulse = 0, lum = 0;
let last = performance.now(), t0 = 0;

/* ---------------- 标量场 ---------------- */
const GW = 400, GH = 225;             // 固定网格：不随窗口变，密度观感稳定
const field = new Float32Array(GW * GH);
const tmp = new Float32Array(GW * GH);
let img = null, px32 = null;
let fcv = null, fctx = null;
const KR = 8;                         // 墨点影响半径（格）
const KS = KR * 2 + 1;
const kern = new Float32Array(KS * KS);

function buildKernel() {
  const R2 = KR * KR;
  for (let y = 0; y < KS; y++) {
    for (let x = 0; x < KS; x++) {
      const dx = x - KR, dy = y - KR;
      const d2 = dx * dx + dy * dy;
      if (d2 >= R2) { kern[y * KS + x] = 0; continue; }
      const q = 1 - d2 / R2;
      kern[y * KS + x] = q * q;      // 平滑核，加起来才有 metaball 的融合感
    }
  }
}
buildKernel();

function allocField() {
  fcv = document.createElement('canvas');
  fcv.width = GW; fcv.height = GH;
  fctx = fcv.getContext('2d');
  img = fctx.createImageData(GW, GH);
  px32 = new Uint32Array(img.data.buffer);
}

/* ---------------- 墨点 ---------------- */
const ND = 1100;
const dpx = new Float32Array(ND), dpy = new Float32Array(ND);
const dvx = new Float32Array(ND), dvy = new Float32Array(ND);
const dw = new Float32Array(ND), dsd = new Float32Array(ND);

function spawnDrop(i, anywhere) {
  dpx[i] = Math.random() * GW;
  dpy[i] = anywhere ? Math.random() * GH : (Math.random() < 0.5 ? -8 : GH + 8);
  dvx[i] = (Math.random() - 0.5) * 5;
  dvy[i] = (Math.random() - 0.5) * 5;
  dw[i] = 0.34 + Math.random() * 0.26;
  dsd[i] = Math.random() * 6.283;
}
for (let i = 0; i < ND; i++) spawnDrop(i, true);

/* ---------------- 字形点云 + 捕获查找表 ---------------- */
const off = document.createElement('canvas');
const octx = off.getContext('2d', { willReadFrequently: true });

function glyphPoints(text) {
  const F = 100;
  const maxW = Math.min(W * 0.8, 1300);
  octx.font = '800 ' + F + 'px "PingFang SC","Microsoft YaHei",system-ui,sans-serif';
  let w = Math.ceil(octx.measureText(text).width) + 8;
  const fs = w > maxW ? F * (maxW / w) : F;
  octx.font = '800 ' + fs + 'px "PingFang SC","Microsoft YaHei",system-ui,sans-serif';
  w = Math.ceil(octx.measureText(text).width) + 8;
  const h = Math.ceil(fs * 1.35);
  off.width = w; off.height = h;
  octx.clearRect(0, 0, w, h);
  octx.font = '800 ' + fs + 'px "PingFang SC","Microsoft YaHei",system-ui,sans-serif';
  octx.textAlign = 'center'; octx.textBaseline = 'middle';
  octx.fillStyle = '#fff';
  octx.fillText(text, w / 2, h / 2);
  const d = octx.getImageData(0, 0, w, h).data;
  const pts = [];
  const step = 4;
  for (let y = 0; y < h; y += step)
    for (let x = 0; x < w; x += step)
      if (d[(y * w + x) * 4 + 3] > 128) pts.push(x - w / 2, y - h / 2);
  return { pts: pts, w: w, h: h };
}

const anchors = [];
for (let i = 0; i < 96; i++) {
  const g = i * 2.399963;
  const rr = 0.30 + 0.70 * (((i * 37) % 97) / 97);
  anchors.push({ nx: Math.cos(g) * rr, ny: Math.sin(g) * rr * 0.66 });
}
function placeAnchor(a, hw, hh, gcx, gcy) {
  const M = 60;
  const x0 = M + hw - gcx, x1 = W - M - hw - gcx;
  const y0 = M + hh - gcy, y1 = H - M - hh - gcy;
  return {
    x: x1 > x0 ? x0 + (a.nx * 0.5 + 0.5) * (x1 - x0) : W / 2 - gcx,
    y: y1 > y0 ? y0 + (a.ny * 0.5 + 0.5) * (y1 - y0) : H / 2 - gcy
  };
}

/* 捕获查找表：格 → 最近的笔画点（格坐标）。换句时整块重建。 */
const LC = 30;                        // 查找表格边长（格）
let lgw = 0, lgh = 0;
let lx = null, ly = null, lvalid = null;

function buildCapture(idx) {
  lgw = Math.ceil(GW / LC) + 1;
  lgh = Math.ceil(GH / LC) + 1;
  const n = lgw * lgh;
  if (!lx || lx.length < n) {
    lx = new Float32Array(n); ly = new Float32Array(n); lvalid = new Uint8Array(n);
  }
  lvalid.fill(0);
  if (idx < 0 || !lines[idx]) return;
  const g = glyphPoints(lines[idx].text);
  const pts = g.pts, pc = pts.length / 2;
  if (!pc) return;
  let bx0 = 1e9, bx1 = -1e9, by0 = 1e9, by1 = -1e9;
  for (let k = 0; k < pts.length; k += 2) {
    if (pts[k] < bx0) bx0 = pts[k];
    if (pts[k] > bx1) bx1 = pts[k];
    if (pts[k + 1] < by0) by0 = pts[k + 1];
    if (pts[k + 1] > by1) by1 = pts[k + 1];
  }
  const A = placeAnchor(anchors[idx % anchors.length],
    (bx1 - bx0) / 2, (by1 - by0) / 2, (bx0 + bx1) / 2, (by0 + by1) / 2);
  const sx = GW / W, sy = GH / H;
  const cap = Math.min(pc, 2400);
  for (let c = 0; c < lgw; c++) {
    const wx = (c + 0.5) * LC;
    for (let r = 0; r < lgh; r++) {
      const wy = (r + 0.5) * LC;
      let best = 1e18, bi = -1;
      for (let k = 0; k < cap; k++) {
        const q = (Math.floor(k * pc / cap) % pc) * 2;   // 等间隔取样，别按扫描顺序
        const pxg = (A.x + pts[q]) * sx;
        const pyg = (A.y + pts[q + 1]) * sy;
        const dx = pxg - wx, dy = pyg - wy;
        const d2 = dx * dx + dy * dy;
        if (d2 < best) { best = d2; bi = k; }
      }
      const i = r * lgw + c;
      if (bi >= 0) {
        const q = (Math.floor(bi * pc / cap) % pc) * 2;
        lx[i] = (A.x + pts[q]) * sx;
        ly[i] = (A.y + pts[q + 1]) * sy;
        lvalid[i] = 1;
      }
    }
  }
}

function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = Math.max(1, window.innerWidth);
  H = Math.max(1, window.innerHeight);
  cv.width = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  allocField();
  buildCapture(curIdx);
}

/* ---------------- 节奏 ---------------- */
const now = () => clockT + (playing ? (performance.now() - clockAt) / 1000 : 0);

/* ================= 节奏：1-10 的教训固化在这里 =================
   ① 显示与酝酿分离 —— curIdx 只在句首切换，brewIdx 提前 lead 秒准备
   ② 索引单调不回退 —— 时钟在 tick 之间外推、tick 一来会往回缩一点，
      不锁单调的话句边界来回跳、同一句被反复重建
   ③ 提前量自适应 —— 快歌早开始，慢歌不提前太多
   ④ 只有拖进度条（时间明显倒退）才允许重置
   ================================================================ */
const LEAD = 1.3;
function timing(T) {
  if (!lines.length) return;
  if (T < lastT - 0.6) {
    curIdx = -1; brewIdx = -1;
    if (lvalid) lvalid.fill(0);        // 释放上一句的捕获区
  }
  lastT = T;
  let ci = curIdx;
  while (ci + 1 < lines.length && T >= lines[ci + 1].t) ci++;
  if (ci !== curIdx) {
    curIdx = ci;
    brewIdx = -1;
    buildCapture(ci);                  // 捕获区整块换掉 = 旧笔画上的墨被放开
    hint.style.opacity = lines.length ? (ci >= 0 ? '0' : '1') : '0.5';
  }
  const nx = curIdx + 1;
  if (nx < lines.length && brewIdx !== nx) {
    const gap = lines[nx].t - (curIdx >= 0 ? lines[curIdx].t : lines[nx].t - 4);
    const lead = Math.min(LEAD, Math.max(0.45, gap * 0.55));
    if (T >= lines[nx].t - lead) brewIdx = nx;
  }
}

/* ---------------- 主循环 ---------------- */
function frame(nowMs) {
  const dt = Math.min(0.05, (nowMs - last) / 1000);
  last = nowMs; t0 += dt;
  const T = now();
  timing(T);

  pulse *= Math.exp(-dt * 2.2);
  lum += ((playing ? 1 : 0.5) - lum) * Math.min(1, dt * 1.8);

  /* ---- 墨点：湍流 + 捕获 + 沉积 ---- */
  const cxg = GW * 0.5, cyg = GH * 0.5;
  const beatPush = pulse * 46;
  for (let i = 0; i < ND; i++) {
    const x = dpx[i], y = dpy[i];
    /* 低频旋度场（sin/cos 拼的廉价近似，比真噪声快得多） */
    const tx = Math.sin(y * 0.031 + t0 * 0.42 + dsd[i]) * 15 + Math.cos(x * 0.017 - t0 * 0.31) * 8;
    const ty = Math.cos(x * 0.027 - t0 * 0.37 + dsd[i]) * 15 + Math.sin(y * 0.021 + t0 * 0.29) * 8;
    dvx[i] += (tx - dvx[i]) * Math.min(1, dt * 0.9);
    dvy[i] += (ty - dvy[i]) * Math.min(1, dt * 0.9);

    /* 缓慢向心：云气整体绕着中心翻涌，不会全飘出画面 */
    const ox = cxg - x, oy = cyg - y;
    const od = Math.sqrt(ox * ox + oy * oy) + 1e-3;
    dvx[i] += (ox / od) * dt * 5.0;
    dvy[i] += (oy / od) * dt * 5.0;

    /* 踩拍：从画面中心向外的一记整体推力（相干），墨云鼓一下再收回 */
    if (beatPush > 0.5) {
      dvx[i] -= (ox / od) * beatPush * dt * 6.0;
      dvy[i] -= (oy / od) * beatPush * dt * 6.0;
    }

    /* 捕获：靠近笔画的墨点被拽住、减速、沉积 */
    let caught = 0;
    if (lvalid) {
      const c = (x / LC) | 0, r = (y / LC) | 0;
      if (c >= 0 && r >= 0 && c < lgw && r < lgh && lvalid[r * lgw + c]) {
        const gxp = lx[r * lgw + c], gyp = ly[r * lgw + c];
        const gx2 = gxp - x, gy2 = gyp - y;
        const gd = Math.sqrt(gx2 * gx2 + gy2 * gy2) + 1e-3;
        if (gd < 40) {
          const pull = (1 - gd / 40);
          caught = pull;
          dvx[i] += (gx2 / gd) * pull * dt * 62;
          dvy[i] += (gy2 / gd) * pull * dt * 62;
          const damp = Math.min(0.94, dt * (2.0 + pull * 7.0));
          dvx[i] -= dvx[i] * damp;
          dvy[i] -= dvy[i] * damp;
        }
      }
    }
    if (!caught) {
      dvx[i] -= dvx[i] * Math.min(0.5, dt * 0.30);
      dvy[i] -= dvy[i] * Math.min(0.5, dt * 0.30);
    }
    dpx[i] = x + dvx[i] * dt;
    dpy[i] = y + dvy[i] * dt;
    if (dpx[i] < -12) dpx[i] = GW + 12;
    if (dpx[i] > GW + 12) dpx[i] = -12;
    if (dpy[i] < -12) dpy[i] = GH + 12;
    if (dpy[i] > GH + 12) dpy[i] = -12;
  }

  /* ---- 标量场：只有墨点周围的核被累加，其余格子原样保留 ---- */
  field.fill(0);
  for (let i = 0; i < ND; i++) {
    const x = dpx[i], y = dpy[i], w = dw[i];
    let c0 = Math.round(x) - KR, r0 = Math.round(y) - KR;
    let x0 = 0, y0 = 0, x1 = KS, y1 = KS;
    if (c0 < 0) { x0 = -c0; c0 = 0; }
    if (r0 < 0) { y0 = -r0; r0 = 0; }
    if (c0 + (x1 - x0) > GW) x1 = x0 + (GW - c0);
    if (r0 + (y1 - y0) > GH) y1 = y0 + (GH - r0);
    for (let r = y0; r < y1; r++) {
      const ky = r * KS;
      let o = (r0 + r - y0) * GW + c0;
      for (let c = x0; c < x1; c++) {
        field[o++] += kern[ky + c] * w;
      }
    }
  }

  /* ---- 可分离模糊：两次一维，比 3x3 便宜，墨边更柔 ---- */
  for (let r = 0; r < GH; r++) {
    const base = r * GW;
    for (let c = 0; c < GW; c++) {
      const l = c > 0 ? field[base + c - 1] : field[base + c];
      const rr = c < GW - 1 ? field[base + c + 1] : field[base + c];
      tmp[base + c] = (l + field[base + c] * 2 + rr) * 0.25;
    }
  }
  for (let c = 0; c < GW; c++) {
    for (let r = 0; r < GH; r++) {
      const u = r > 0 ? tmp[(r - 1) * GW + c] : tmp[c];
      const d = r < GH - 1 ? tmp[(r + 1) * GW + c] : tmp[(GH - 1) * GW + c];
      field[r * GW + c] = (u + tmp[r * GW + c] * 2 + d) * 0.25;
    }
  }

  /* ---- 浓淡 → 像素。整帧只有这一次逐格写 ---- */
  const th = 0.40 + pulse * 0.10;        // 踩拍时阈值上抬，墨被"冲淡"一瞬
  const gain = 1.02 * (0.76 + 0.24 * lum) * (1 + pulse * 0.14);
  const ar = accent[0], ag = accent[1], ab = accent[2];
  for (let i = 0, n = GW * GH; i < n; i++) {
    let f = field[i] * gain;
    if (f <= th) { px32[i] = 0; continue; }
    let d = (f - th) * 1.9;
    if (d > 1) d = 1;
    /* 墨的色阶：稀薄处偏冷灰蓝 → 沉积处转主色 → 最浓处近白（浓墨反光） */
    let r, g, b;
    if (d < 0.42) {
      const q = d / 0.42;
      r = 24 + (ar * 0.55 - 24) * q;
      g = 29 + (ag * 0.55 - 29) * q;
      b = 40 + (ab * 0.60 - 40) * q;
    } else if (d < 0.78) {
      const q = (d - 0.42) / 0.36;
      r = ar * 0.55 + (ar * 0.92 - ar * 0.55) * q;
      g = ag * 0.55 + (ag * 0.92 - ag * 0.55) * q;
      b = ab * 0.60 + (ab * 0.98 - ab * 0.60) * q;
    } else {
      const q = (d - 0.78) / 0.22;
      r = ar * 0.92 + (238 - ar * 0.92) * q;
      g = ag * 0.92 + (242 - ag * 0.92) * q;
      b = ab * 0.98 + (250 - ab * 0.98) * q;
    }
    const a = Math.min(255, (d * 1.15) * 255) | 0;
    px32[i] = ((a << 24) | ((b | 0) << 16) | ((g | 0) << 8) | (r | 0)) >>> 0;
  }
  fctx.putImageData(img, 0, 0);

  /* ---- 放大成整幅：一次 drawImage ---- */
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#0a0c10';
  ctx.fillRect(0, 0, W, H);
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(fcv, 0, 0, W, H);

  /* ---- 一层极淡的暖色，对应参考里墨云边缘的橙 ---- */
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.055 + pulse * 0.05;
  const wg = ctx.createRadialGradient(W * 0.5, H * 0.62, 0, W * 0.5, H * 0.62, Math.max(W, H) * 0.5);
  wg.addColorStop(0, 'rgba(255,140,60,1)');
  wg.addColorStop(1, 'rgba(255,140,60,0)');
  ctx.fillStyle = wg;
  ctx.fillRect(0, 0, W, H);

  /* ---- 暗角 ---- */
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.30, W / 2, H / 2, Math.max(W, H) * 0.78);
  vg.addColorStop(0, 'rgba(6,7,10,0)');
  vg.addColorStop(1, 'rgba(6,7,10,0.62)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  requestAnimationFrame(frame);
}

resize();
addEventListener('resize', resize);
requestAnimationFrame(frame);

/* ---- 与播放器通信 ---- */
const ping = () => { try { parent.postMessage({ __c100: 1, type: 'activity' }, '*'); } catch (_) {} };
addEventListener('pointermove', ping, { passive: true });
addEventListener('pointerdown', ping, { passive: true });
addEventListener('wheel', ping, { passive: true });
addEventListener('keydown', ping);
addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.key === ' ') {
    e.preventDefault();
    try { parent.postMessage({ __c100: 1, type: 'key', payload: { key: 'Space' } }, '*'); } catch (_) {}
  }
}, true);

addEventListener('message', (e) => {
  const d = e.data;
  if (!d || d.__c100 !== 1) return;
  if (d.type === 'init') {
    const p = d.payload || {};
    lines = (p.lines || []).slice().sort((a, b) => a.t - b.t);
    curIdx = -1; brewIdx = -1; lastT = -1;
    if (lvalid) lvalid.fill(0);
    if (p.accent && p.accent.length === 3) {
      /* 墨以冷调为主，主色只做 40% 混入 */
      accent = [
        Math.round(150 * 0.6 + p.accent[0] * 0.4),
        Math.round(175 * 0.6 + p.accent[1] * 0.4),
        Math.round(205 * 0.6 + p.accent[2] * 0.4)
      ];
    }
    for (let i = 0; i < ND; i++) spawnDrop(i, true);
    clockT = 0; clockAt = performance.now();
    hint.textContent = lines.length ? '等待第一句…' : '这首没有歌词';
    hint.style.opacity = lines.length ? '1' : '0.5';
  } else if (d.type === 'tick') {
    clockT = d.payload.time; clockAt = performance.now(); playing = !!d.payload.playing;
  } else if (d.type === 'beat') {
    /* 踩拍：全团墨从中心被推一下（相干），不是逐点乱踢 */
    pulse = Math.min(1.5, pulse + 0.42 + (d.payload.level || 0) * 0.5);
  }
});
try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); } catch (_) {}

window.__stage = () => ({
  lines: lines.length, curIdx: curIdx, brewIdx: brewIdx,
  drops: ND, grid: GW + 'x' + GH, t: +now().toFixed(2)
});
</script>
</body>
</html>
