<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LIZI · 播放控制实验室（12 版）</title>
<style>
  :root{
    --cover: url("/api/img?url=http%3A%2F%2Fp2.music.126.net%2Fpdpmj0csBR_nUM7c2xr6pA%3D%3D%2F109951174135616642.jpg%3Fparam%3D500y500");
  }
  *{box-sizing:border-box}
  body{margin:0;padding:34px 28px 80px;background:#0b0b0e;color:#fff;
       font-family:-apple-system,"SF Pro Text","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
  header{max-width:1500px;margin:0 auto 24px}
  h1{font-size:20px;margin:0 0 6px;letter-spacing:-.01em}
  .lead{margin:0;color:rgba(255,255,255,.5);font-size:13px;line-height:1.7}
  .grid{max-width:1500px;margin:0 auto;display:grid;gap:18px;
        grid-template-columns:repeat(auto-fill,minmax(440px,1fr))}
  .card{position:relative;overflow:hidden;border-radius:18px;background:#0d0d11;
        box-shadow:0 10px 30px rgba(0,0,0,.4), inset 0 0 0 1px rgba(255,255,255,.05)}
  .bg{position:absolute;inset:0;background:var(--cover) center/cover;opacity:.16;
      filter:blur(34px) saturate(1.3);transform:scale(1.2);pointer-events:none}
  .cap{position:relative;display:flex;gap:8px;align-items:baseline;
       padding:14px 18px 0;font-size:12.5px;color:rgba(255,255,255,.62)}
  .cap b{color:rgba(255,255,255,.32);font-variant-numeric:tabular-nums}
  .pad{position:relative;display:flex;align-items:center;justify-content:center;
       gap:28px;height:116px}

  /* 公共：纯字形，无底板 —— Apple 的默认语言 */
  .btn{width:44px;height:44px;display:grid;place-items:center;border:0;padding:0;
       background:none;color:#fff;border-radius:50%;cursor:pointer;
       transition:transform .16s cubic-bezier(.32,.72,0,1),background .16s,opacity .16s,box-shadow .16s}
  .btn svg{width:21px;height:21px;fill:currentColor;display:block}
  .btn:hover{opacity:.92}
  .btn:active{transform:scale(.9)}
  .btn.play{width:64px;height:64px}
  .btn.play svg{width:28px;height:28px}
  .btn.play:active{transform:scale(.94)}

  /* 01 Apple 基准：纯字形，播放键大一号（无任何底板） */
  .v01 .pad{gap:32px}
  .v01 .btn.play svg{width:34px;height:34px}

  /* 02 纯字形 + 播放键一层极淡的圆底（点得准，但不抢眼） */
  .v02 .pad{gap:30px}
  .v02 .btn.play{background:rgba(255,255,255,.10)}
  .v02 .btn.play svg{width:32px;height:32px}

  /* 03 实心白圆播放键（Apple 海报/锁屏那套） */
  .v03 .pad{gap:30px}
  .v03 .btn.play{background:#fff;color:#101014;box-shadow:0 12px 30px rgba(0,0,0,.45)}
  .v03 .btn.play svg{width:30px;height:30px}

  /* 04 白圆播放键 + 其余玻璃圆 */
  .v04 .pad{gap:22px}
  .v04 .btn:not(.play){background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.10)}
  .v04 .btn.play{background:#fff;color:#101014;box-shadow:0 12px 30px rgba(0,0,0,.45)}
  .v04 .btn.play svg{width:30px;height:30px}

  /* 05 全玻璃圆（现状的改良：去描边、减内阴影、统一 46px） */
  .v05 .pad{gap:18px}
  .v05 .btn{width:46px;height:46px;background:rgba(255,255,255,.07);
            box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
  .v05 .btn.play{width:58px;height:58px;background:rgba(255,255,255,.14)}
  .v05 .btn.play svg{width:26px;height:26px}

  /* 06 药丸底板：整排坐在一条半透明胶囊上 */
  .v06 .pad{width:max-content;margin:0 auto;padding:0 26px;height:76px;
            gap:24px;background:rgba(255,255,255,.07);border-radius:999px;
            box-shadow:inset 0 1px 0 rgba(255,255,255,.10)}
  .v06 .btn.play{width:56px;height:56px;background:#fff;color:#101014}
  .v06 .btn.play svg{width:26px;height:26px}

  /* 07 线框圆播放键 */
  .v07 .pad{gap:30px}
  .v07 .btn.play{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.75)}
  .v07 .btn.play svg{width:26px;height:26px}

  /* 08 新拟态：凸起圆（暗面上靠明暗做出体积） */
  .v08 .pad{gap:20px}
  .v08 .btn{width:48px;height:48px;background:linear-gradient(150deg,#1a1a21,#0c0c10);
            box-shadow:5px 5px 12px rgba(0,0,0,.65), -4px -4px 12px rgba(255,255,255,.05),
                       inset 0 1px 0 rgba(255,255,255,.06)}
  .v08 .btn:active{box-shadow:inset 4px 4px 10px rgba(0,0,0,.7), inset -3px -3px 8px rgba(255,255,255,.04)}
  .v08 .btn.play{width:62px;height:62px;background:linear-gradient(150deg,#ffffff,#dcdce2);color:#101014;
                 box-shadow:0 12px 26px rgba(0,0,0,.5), inset 0 -3px 6px rgba(0,0,0,.12)}
  .v08 .btn.play svg{width:28px;height:28px}

  /* 09 极简线稿：细一档的字形，播放键实心 */
  .v09 .pad{gap:36px}
  .v09 .btn:not(.play) svg{width:18px;height:18px;opacity:.66}
  .v09 .btn.play svg{width:36px;height:36px}

  /* 10 圆角方形一组 */
  .v10 .pad{gap:8px}
  .v10 .btn{width:54px;height:44px;border-radius:12px;background:rgba(255,255,255,.06)}
  .v10 .btn:first-child{border-radius:12px 4px 4px 12px}
  .v10 .btn:last-child{border-radius:4px 12px 12px 4px}
  .v10 .btn.play{width:64px;height:48px;border-radius:12px;background:#fff;color:#101014}
  .v10 .btn.play svg{width:26px;height:26px}

  /* 11 超大间距：play 极大，其余极小（海报感） */
  .v11 .pad{gap:52px}
  .v11 .btn:not(.play){width:34px;height:34px}
  .v11 .btn:not(.play) svg{width:17px;height:17px;opacity:.75}
  .v11 .btn.play{width:78px;height:78px}
  .v11 .btn.play svg{width:40px;height:40px}

  /* 播放键形变：三角 ↔ 双条（两半各自把 d 拉直，中间"裂开"） */
  .btn.play .pn{fill:currentColor;transition:d .34s cubic-bezier(.32,.72,0,1)}
  .btn.play .pn-l{d:path("M8 4.6L13.6 8.2L13.6 15.8L8 19.4Z")}
  .btn.play .pn-r{d:path("M14.4 8.3L20 12L20 12L14.4 15.7Z")}
  .btn.play[data-on="1"] .pn-l{d:path("M8 5L11.2 5L11.2 19L8 19Z")}
  .btn.play[data-on="1"] .pn-r{d:path("M13.8 5L17 5L17 19L13.8 19Z")}

  /* 12 播放键带柔和光晕（不加硬边，只加一层很淡的外发光） */
  .v12 .pad{gap:30px}
  .v12 .btn.play{background:#fff;color:#101014;
                 box-shadow:0 10px 30px rgba(255,255,255,.18), 0 0 60px rgba(255,255,255,.10)}
  .v12 .btn.play svg{width:30px;height:30px}
</style>
</head>
<body>

<header>
  <h1>LIZI · 播放控制实验室</h1>
  <p class="lead">
    12 种传输排。素材相同（同一张封面背景、同样四个键），<b>只变形态</b>。<br>
    鼠标悬停/按住能看反馈；<b>点播放键看三角裂成双条的形变</b>。挑一个编号告诉我就行。
  </p>
</header>

<div class="grid" id="grid"></div>

<script>
const ICON = {
  mode:  '<path d="M7 5h9l-2-2 1.4-1.4L19.8 6 15.4 10.4 14 9l2-2H7zM17 19H8l2 2-1.4 1.4L4.2 18 8.6 13.6 10 15l-2 2h9z"/>',
  prev:  '<path d="M6 5h2.2v14H6zM19 5v14L8.8 12z"/>',
  next:  '<path d="M15.8 5H18v14h-2.2zM5 5v14l10.2-7z"/>',
  play:  '<path class="pn pn-l" d="M8 4.6L13.6 8.2L13.6 15.8L8 19.4Z"/><path class="pn pn-r" d="M14.4 8.3L20 12L20 12L14.4 15.7Z"/>',
  pause: '<path d="M7 4.8h3.6v14.4H7zM13.4 4.8H17v14.4h-3.6z"/>',
};
const svg = (k) => '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICON[k] + '</svg>';

const VARIANTS = [
  ['01','Apple 基准 · 纯字形 · 播放键大一号'],
  ['02','纯字形 + 播放键极淡圆底'],
  ['03','实心白圆播放键（Apple 海报那套）'],
  ['04','白圆播放键 + 其余玻璃圆'],
  ['05','全玻璃圆（去描边 · 更克制）'],
  ['06','药丸底板 · 整排坐在胶囊上'],
  ['07','线框圆播放键'],
  ['08','新拟态 · 明暗做体积'],
  ['09','极简线稿 · 只有播放键实心'],
  ['10','圆角方形一组'],
  ['11','超大间距 · 海报感'],
  ['12','白圆播放键 + 一层柔和光晕'],
];

const grid = document.getElementById('grid');
grid.innerHTML = VARIANTS.map(([n, name]) => `
  <figure class="card v${n}">
    <div class="bg"></div>
    <figcaption class="cap"><b>${n}</b><span>${name}</span></figcaption>
    <div class="pad">
      <button class="btn" aria-label="播放模式">${svg('mode')}</button>
      <button class="btn" aria-label="上一首">${svg('prev')}</button>
      <button class="btn play" data-on="0" aria-label="播放">${svg('play')}</button>
      <button class="btn" aria-label="下一首">${svg('next')}</button>
    </div>
  </figure>`).join('');

document.querySelectorAll('.btn.play').forEach((b) => {
  b.addEventListener('click', () => {
    const on = b.dataset.on === '1';
    b.dataset.on = on ? '0' : '1';
    b.setAttribute('aria-label', on ? '播放' : '暂停');
  });
});
</script>
</body>
</html>
