<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    酷狗「mark 版」：只保留白圆环 + 白 K，不含蓝底方块。

    原始 kugou.svg 的结构是：
      path1 = 蓝圆角方块，中间挖一个 r=307.2 的圆洞
      path2 = r=276.48 的蓝圆盘，中间挖出 K
    在白底上看到的就是：蓝方块 + 白圆环（两者半径差 30.72）+ 蓝盘 + 白 K。

    铺到品牌蓝底上时，蓝方块和蓝盘都会融进背景，只剩白环和白 K，正是想要的效果。
    但直接用原 SVG 不行：它的环和 K 是「洞」，会透出底色，在蓝底上一起消失。

    所以这里把环和 K 显式画成白色：
      圆环 = 半径 291.84 的描边（正好在 276.48 与 307.2 之间），线宽 30.72
      K    = 从原 path2 里取出的 K 子路径（m 换成 M，起点换算成绝对坐标），填白
    叠在 #3D8BFA 底色上，视觉与原始图标在白底上的样子一致。
  -->
  <circle cx="512" cy="512" r="291.84" fill="none" stroke="#FFFFFF" stroke-width="30.72"/>
  <path fill="#FFFFFF" d="M555.008 529.92l103.424 132.61824h-94.208L485.376 549.376c-13.17376-19.968-16.65024-35.29728-16.10752-46.49472l-14.84288 159.65696h-70.656l27.70944-297.984h70.656l-12.5184 134.63552c1.90976-14.06464 10.1632-20.46976 10.1632-20.46976l114.1504-114.16576h87.04S581.63712 464.896 559.616 486.912s-4.608 43.008-4.608 43.008z"/>
</svg>
