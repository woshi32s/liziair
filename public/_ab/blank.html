<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>blank</title>
<style>html,body{margin:0;height:100%;background:#04030b;overflow:hidden}#c{position:fixed;inset:0;width:100%;height:100%;display:block}</style>
</head><body>
<canvas id="c"></canvas>
<script>
"use strict";
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = Math.max(1, window.innerWidth); H = Math.max(1, window.innerHeight);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resize(); addEventListener('resize', resize);
let last = performance.now(), t0 = 0;
const MODE = (location.hash || '#none').slice(1);
function frame(nowMs) {
  const dt = Math.min(0.05, (nowMs - last) / 1000); last = nowMs; t0 += dt;
  const cx = W / 2, cy = H / 2;
  if (MODE === 'fill') {                 // 1 次 200×200 fillRect
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#123';
    ctx.fillRect(cx - 100 + Math.sin(t0) * 60, cy - 100, 200, 200);
  } else if (MODE === 'fullfill') {      // 1 次全屏 fillRect
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#0a0716';
    ctx.fillRect(0, 0, W, H);
  } else if (MODE === 'grad') {          // 全屏径向渐变（每帧新建）
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.72);
    g.addColorStop(0, 'rgb(26,17,48)'); g.addColorStop(0.55, 'rgb(10,7,22)'); g.addColorStop(1, 'rgb(4,3,11)');
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  } else if (MODE === 'blit') {          // 全屏 drawImage（半分辨率贴图放大）
    if (!window.__lay) {
      const c = document.createElement('canvas'); c.width = Math.round(W / 2); c.height = Math.round(H / 2);
      const g = c.getContext('2d');
      const rg = g.createRadialGradient(c.width / 2, c.height / 2, 0, c.width / 2, c.height / 2, Math.max(c.width, c.height) * 0.72);
      rg.addColorStop(0, 'rgb(26,17,48)'); rg.addColorStop(0.55, 'rgb(10,7,22)'); rg.addColorStop(1, 'rgb(4,3,11)');
      g.fillStyle = rg; g.fillRect(0, 0, c.width, c.height); window.__lay = c;
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(window.__lay, 0, 0, W, H);
  } else if (MODE === 'text') {          // 8 次 strokeText（和 018 同量级）
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#0a0716'; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    ctx.font = '800 100px "PingFang SC","Microsoft YaHei",system-ui,sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.strokeStyle = 'rgba(200,180,255,0.9)';
    for (let i = 0; i < 8; i++) {
      ctx.save();
      ctx.translate(cx, cy); ctx.rotate(i * 0.4); ctx.scale(1 - i * 0.08, 1 - i * 0.08);
      ctx.lineWidth = 1.7;
      ctx.strokeText('当自我磨平了轮廓', 0, 0);
      ctx.restore();
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__stage = () => ({ mode: MODE, t: +t0.toFixed(2) });
</script>
</body></html>
