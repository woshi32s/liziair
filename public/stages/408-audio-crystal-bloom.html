<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>音生晶簇</title>
<style>
  :root { --accent: 138, 190, 255; --ink: 236, 241, 255; --fit: 1; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05060a; color: rgb(var(--ink)); }
  body {
    font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: ""; position: fixed; inset: -12%; z-index: 0;
    background:
      radial-gradient(46% 52% at 50% 36%, rgba(var(--accent), 0.15), rgba(0, 0, 0, 0) 72%),
      radial-gradient(82% 88% at 50% 112%, rgba(var(--accent), 0.08), rgba(0, 0, 0, 0) 74%),
      #05060a;
  }
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 1; }
  #meta {
    position: fixed; z-index: 3; top: clamp(18px, 3.2vh, 36px); left: clamp(20px, 3.4vw, 48px);
    pointer-events: none; max-width: 62vw;
  }
  #metaTitle {
    font-size: clamp(11px, 0.95vw, 14px); letter-spacing: 0.2em; color: rgba(var(--ink), 0.8);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #metaSub {
    margin-top: 7px; font-size: clamp(9px, 0.78vw, 11px); letter-spacing: 0.28em;
    text-transform: uppercase; color: rgba(var(--ink), 0.34);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #signal {
    position: fixed; z-index: 3; top: clamp(20px, 3.4vh, 38px); right: clamp(20px, 3.4vw, 48px);
    display: flex; align-items: flex-end; gap: 5px; height: 20px; pointer-events: none;
  }
  #signal i {
    display: block; width: 2px; height: 20px; border-radius: 1px;
    background: rgba(var(--accent), 0.9); opacity: 0.55;
    transform: scaleY(0.12); transform-origin: bottom;
    transition: transform 0.12s linear, opacity 0.2s linear;
  }
  #lyrics {
    position: fixed; left: 0; right: 0; bottom: clamp(42px, 10vh, 118px); z-index: 4;
    padding: 0 5vw; display: flex; flex-direction: column; align-items: center;
    justify-content: flex-end; gap: clamp(9px, 1.9vh, 22px); pointer-events: none;
  }
  #lyrics::before {
    content: ""; position: absolute; z-index: -1; left: 50%; bottom: -6vh;
    width: min(140vw, 1500px); height: 60vh; transform: translateX(-50%);
    background: radial-gradient(50% 60% at 50% 70%, rgba(5, 6, 10, 0.72), rgba(5, 6, 10, 0) 72%);
  }
  .slot {
    max-width: min(92vw, 1140px); text-align: center; line-height: 1.46;
    white-space: pre-wrap; overflow-wrap: break-word;
  }
  .slot.prev, .slot.next {
    font-size: clamp(13px, 1.28vw, 19px); letter-spacing: 0.09em;
    color: rgba(var(--ink), 0.2); transition: opacity 0.5s ease; min-height: 1.3em;
  }
  .slot.now {
    font-size: calc(clamp(23px, 4vw, 55px) * var(--fit, 1));
    font-weight: 500; letter-spacing: 0.045em; color: rgb(var(--ink));
    text-shadow: 0 0 34px rgba(var(--accent), 0.3);
  }
  .ch { color: rgba(var(--ink), 0.33); transition: color 0.16s linear; }
  .ch.on { color: rgba(var(--ink), 0.98); text-shadow: 0 0 18px rgba(var(--accent), 0.6); }
  #nowBar {
    display: block; width: min(44vw, 330px); height: 1px; margin: clamp(10px, 1.5vh, 18px) auto 0;
    background: rgba(var(--ink), 0.1); border-radius: 1px; overflow: hidden;
  }
  #nowBar span {
    display: block; width: 100%; height: 100%; transform: scaleX(0); transform-origin: left center;
    background: linear-gradient(90deg, rgba(var(--accent), 0.15), rgba(var(--accent), 0.95));
  }
  .empty {
    display: flex; flex-direction: column; align-items: center; gap: clamp(12px, 2vh, 20px);
    font-size: clamp(12px, 1.05vw, 15px); letter-spacing: 0.46em;
    color: rgba(var(--ink), 0.36); padding-left: 0.46em;
  }
  .empty .rule {
    display: block; width: min(26vw, 148px); height: 1px;
    background: linear-gradient(90deg, rgba(var(--accent), 0), rgba(var(--accent), 0.6), rgba(var(--accent), 0));
  }
  .hidden { display: none !important; }
  @media (max-width: 640px) {
    #signal { display: none; }
    .slot.now { letter-spacing: 0.02em; }
    #lyrics { bottom: clamp(34px, 8vh, 70px); padding: 0 6vw; }
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="meta">
  <div id="metaTitle"></div>
  <div id="metaSub"></div>
</div>

<div id="signal"><i></i><i></i><i></i></div>

<div id="lyrics">
  <div class="slot prev" id="slotPrev"></div>
  <div class="slot now" id="slotNow"><span id="nowText"></span><span id="nowBar"><span></span></span></div>
  <div class="slot next" id="slotNext"></div>
  <div class="empty hidden" id="emptyState"><span class="rule"></span><span id="emptyLabel">纯音乐 · 无歌词</span></div>
</div>
<script>

/* ---- 形态设置面板：宿主在 ready 后同步读取，必须先于 ready 声明 ---- */
window.__liziShake = true;
window.__stagePanel = {
  title: '音生晶簇',
  items: [
    { key: 'shake', label: '震动', type: 'switch', def: true }
  ]
};
addEventListener('message', function (e) {
  var d = e.data;
  if (!d || d.__c100 !== 1 || d.type !== 'setting' || !d.payload) return;
  if (d.payload.key === 'shake') window.__liziShake = d.payload.value !== false;
});
(function () {
  'use strict';

  /* 1. 最外层无条件暴露自检口（不依赖任何初始化，第一段） */
  window.__stage = function () {
    return {
      lines: stageState.lines,
      idx: stageState.idx,
      t: stageState.t,
      playing: stageState.playing,
      frames: stageState.frames,
      js: stageState.js,
      err: stageState.err,
      text: stageState.text,
      gl: stageState.gl,
      rm: stageState.rm
    };
  };

  /* 2. 舞台状态（自检口只读，初始化必须晚于 __stage 赋值） */
  var FALLBACK_ACCENT = [138, 190, 255];
  var stageState = {
    lines: 0, idx: -1, t: 0, playing: true, frames: 0, js: 0,
    err: '', text: '', gl: false, rm: false,
    linesRaw: [], duration: 0, song: null, started: false,
    accent: FALLBACK_ACCENT.slice(), spans: null, charTimes: null, litCount: 0,
    lineStart: 0, lineDuration: 3, barRatio: -1
  };

  /* 3. 错误限流：每秒最多一条，不静默 */
  var lastErrorAt = -1000;
  function reportError(scopeName, error) {
    var now = (window.performance && performance.now) ? performance.now() : Date.now();
    if (now - lastErrorAt < 1000) { return; }
    lastErrorAt = now;
    console.error('[408 audio-crystal-bloom] ' + scopeName, error);
  }

  /* 3. ready：第一帧无条件发，定时兜底，只发一次 */
  var readySent = false;
  function sendReady() {
    if (readySent) { return; }
    readySent = true;
    try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); }
    catch (error) { reportError('ready', error); }
  }
  requestAnimationFrame(sendReady);
  setTimeout(sendReady, 700);

  /* 4. 环境判定 */
  try {
    stageState.rm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  } catch (error) { reportError('matchMedia', error); }

  var dom = {
    canvas: document.getElementById('gl'),
    metaTitle: document.getElementById('metaTitle'),
    metaSub: document.getElementById('metaSub'),
    slotPrev: document.getElementById('slotPrev'),
    slotNow: document.getElementById('slotNow'),
    slotNext: document.getElementById('slotNext'),
    nowText: document.getElementById('nowText'),
    nowBar: document.getElementById('nowBar'),
    emptyState: document.getElementById('emptyState'),
    emptyLabel: document.getElementById('emptyLabel'),
    signalBars: document.querySelectorAll('#signal i')
  };

  var accentRgb = FALLBACK_ACCENT.slice();
  var accentAltRgb = [96, 150, 255];

  function clampNumber(value, low, high) {
    if (!Number.isFinite(value)) { return low; }
    if (value < low) { return low; }
    if (value > high) { return high; }
    return value;
  }

  function textOf(value) {
    if (value === null || value === undefined) { return ''; }
    return String(value);
  }

  function splitGraphemes(text) {
    try { return Array.from(text); }
    catch (error) { reportError('splitGraphemes', error); return text.split(''); }
  }

  function findLineIndex(lines, time) {
    var index = -1;
    for (var i = 0; i < lines.length; i += 1) {
      if (lines[i].t <= time + 0.001) { index = i; } else { break; }
    }
    return index;
  }

  function sanitizeAccent(value) {
    if (!Array.isArray(value) || value.length < 3) { return FALLBACK_ACCENT.slice(); }
    var result = [];
    for (var i = 0; i < 3; i += 1) {
      result.push(Math.round(clampNumber(Number(value[i]), 0, 255)));
    }
    if (result[0] + result[1] + result[2] < 30) { return FALLBACK_ACCENT.slice(); }
    return result;
  }

  function hueToChannel(base, span, offset) {
    var position = offset;
    if (position < 0) { position += 1; }
    if (position > 1) { position -= 1; }
    if (position < 1 / 6) { return base + (span - base) * 6 * position; }
    if (position < 1 / 2) { return span; }
    if (position < 2 / 3) { return base + (span - base) * (2 / 3 - position) * 6; }
    return base;
  }

  function shiftHue(rgb, degrees, saturationBoost) {
    var red = clampNumber(rgb[0], 0, 255) / 255;
    var green = clampNumber(rgb[1], 0, 255) / 255;
    var blue = clampNumber(rgb[2], 0, 255) / 255;
    var max = Math.max(red, green, blue);
    var min = Math.min(red, green, blue);
    var light = (max + min) / 2;
    var delta = max - min;
    var hue = 0;
    var saturation = 0;
    if (delta > 0.00001) {
      saturation = light > 0.5 ? delta / (2 - max - min) : delta / (max + min);
      if (max === red) { hue = ((green - blue) / delta + (green < blue ? 6 : 0)) / 6; }
      else if (max === green) { hue = ((blue - red) / delta + 2) / 6; }
      else { hue = ((red - green) / delta + 4) / 6; }
    }
    hue = (hue + degrees / 360 + 1) % 1;
    saturation = clampNumber(saturation + saturationBoost, 0.05, 1);
    light = clampNumber(light, 0.12, 0.82);
    var high = light < 0.5 ? light * (1 + saturation) : light + saturation - light * saturation;
    var low = 2 * light - high;
    return [
      Math.round(clampNumber(hueToChannel(low, high, hue + 1 / 3) * 255, 0, 255)),
      Math.round(clampNumber(hueToChannel(low, high, hue) * 255, 0, 255)),
      Math.round(clampNumber(hueToChannel(low, high, hue - 1 / 3) * 255, 0, 255))
    ];
  }

  function applyAccent(value) {
    try {
      var safe = sanitizeAccent(value);
      accentRgb = safe;
      accentAltRgb = shiftHue(safe, 34, 0.06);
      stageState.accent = safe;
      document.documentElement.style.setProperty('--accent', safe[0] + ', ' + safe[1] + ', ' + safe[2]);
      /* 2D 兜底路径的预烘焙光晕要跟着主色换 */
      if (canvasState) { canvasState.glowCanvas = buildGlowCanvas(); }
    } catch (error) { reportError('applyAccent', error); }
  }

  function artistsText(artists) {
    if (Array.isArray(artists)) {
      var names = [];
      for (var i = 0; i < artists.length && i < 6; i += 1) {
        var one = textOf(artists[i]).trim();
        if (one) { names.push(one); }
      }
      return names.join(' · ');
    }
    return textOf(artists).trim();
  }

  function setMeta(song) {
    try {
      var safe = song && typeof song === 'object' ? song : {};
      var name = textOf(safe.name).trim();
      var artists = artistsText(safe.artists);
      dom.metaTitle.textContent = name || '无题';
      dom.metaSub.textContent = artists || '未知艺术家';
    } catch (error) { reportError('setMeta', error); }
  }

  function fitScaleFor(count) {
    if (count <= 12) { return 1; }
    if (count <= 18) { return 0.88; }
    if (count <= 26) { return 0.76; }
    if (count <= 36) { return 0.65; }
    if (count <= 52) { return 0.54; }
    return 0.46;
  }

  function updateReveal(time) {
    var spans = stageState.spans;
    var times = stageState.charTimes;
    if (!spans || !times || spans.length === 0) { return; }
    var lit = 0;
    for (var i = 0; i < times.length; i += 1) {
      if (times[i] <= time + 0.02) { lit = i + 1; }
    }
    if (lit === stageState.litCount) { return; }
    var from = Math.min(lit, stageState.litCount);
    var to = Math.max(lit, stageState.litCount);
    for (var j = from; j < to && j < spans.length; j += 1) {
      spans[j].classList.toggle('on', j < lit);
    }
    stageState.litCount = lit;
  }

  function paintActiveLine(line, time) {
    dom.slotNow.style.setProperty('--fit', String(fitScaleFor(line.text.length)));
    var glyphs = splitGraphemes(line.text);
    var fragment = document.createDocumentFragment();
    var spans = [];
    var times = [];
    var perChar = Array.isArray(line.chars) && line.chars.length === glyphs.length;
    var fallbackSpan = line.dur > 0 ? line.dur : 3.0;
    var drawSpans = glyphs.length <= 120;
    for (var i = 0; i < glyphs.length; i += 1) {
      var moment = perChar ? Number(line.chars[i] && line.chars[i].t) : NaN;
      if (!Number.isFinite(moment)) {
        moment = line.t + fallbackSpan * (i / Math.max(1, glyphs.length));
      }
      times.push(moment);
      if (drawSpans) {
        var element = document.createElement('span');
        element.className = 'ch';
        element.textContent = glyphs[i];
        fragment.appendChild(element);
        spans.push(element);
      }
    }
    dom.nowText.textContent = '';
    if (drawSpans) {
      dom.nowText.appendChild(fragment);
    } else {
      dom.nowText.textContent = line.text;
    }
    stageState.spans = spans;
    stageState.charTimes = times;
    stageState.litCount = 0;
    updateReveal(time);
  }

  function renderLyric() {
    try {
      var lines = stageState.linesRaw;
      var index = stageState.idx;
      var current = index >= 0 ? lines[index] : null;
      dom.slotPrev.textContent = index > 0 ? lines[index - 1].text : '';
      var nextIndex = index >= 0 ? index + 1 : 0;
      dom.slotNext.textContent = nextIndex < lines.length ? lines[nextIndex].text : '';
      if (!current) {
        dom.nowText.textContent = '';
        dom.slotNow.style.setProperty('--fit', '1');
        dom.nowBar.classList.add('hidden');
        stageState.spans = null;
        stageState.charTimes = null;
        stageState.litCount = 0;
        stageState.text = '';
        return;
      }
      dom.nowBar.classList.remove('hidden');
      stageState.lineStart = current.t;
      stageState.lineDuration = current.dur > 0 ? current.dur : 3.0;
      stageState.barRatio = -1;
      paintActiveLine(current, stageState.t);
      stageState.text = current.text;
      updateProgressBar(stageState.t);
    } catch (error) { reportError('renderLyric', error); }
  }

  function updateProgressBar(time) {
    if (stageState.idx < 0 || !dom.nowBar.firstElementChild) { return; }
    var span = stageState.lineDuration > 0 ? stageState.lineDuration : 3.0;
    var ratio = clampNumber((time - stageState.lineStart) / span, 0, 1);
    if (Math.abs(ratio - stageState.barRatio) < 0.004) { return; }
    stageState.barRatio = ratio;
    dom.nowBar.firstElementChild.style.transform = 'scaleX(' + ratio.toFixed(3) + ')';
  }

  function resetLyrics() {
    dom.slotPrev.textContent = '';
    dom.slotNext.textContent = '';
    dom.nowText.textContent = '';
    dom.slotNow.style.setProperty('--fit', '1');
    dom.nowBar.classList.add('hidden');
    stageState.spans = null;
    stageState.charTimes = null;
    stageState.litCount = 0;
    stageState.text = '';
    stageState.idx = -1;
  }

  function handleInit(payload) {
    try {
      var safe = payload && typeof payload === 'object' ? payload : {};
      stageState.song = safe.song && typeof safe.song === 'object' ? safe.song : {};
      stageState.duration = Number.isFinite(Number(safe.duration)) ? Math.max(0, Number(safe.duration)) : 0;
      stageState.playing = safe.playing === undefined ? true : !!safe.playing;
      var incoming = Array.isArray(safe.lines) ? safe.lines : [];
      var cleaned = [];
      for (var i = 0; i < incoming.length && i < 400; i += 1) {
        var item = incoming[i];
        if (!item || typeof item !== 'object') { continue; }
        var lineText = textOf(item.text);
        if (!lineText) { continue; }
        var chars = null;
        if (Array.isArray(item.chars) && item.chars.length > 0) {
          chars = [];
          for (var j = 0; j < item.chars.length && j < 400; j += 1) {
            var glyph = item.chars[j] && typeof item.chars[j] === 'object' ? item.chars[j] : {};
            var glyphTime = Number(glyph.t);
            chars.push({ t: Number.isFinite(glyphTime) ? glyphTime : NaN, c: textOf(glyph.c) });
          }
        }
        cleaned.push({
          t: Number.isFinite(Number(item.t)) ? Number(item.t) : 0,
          dur: Math.max(0, Number(item.dur) || 0),
          text: lineText,
          chars: chars
        });
      }
      cleaned.sort(function (left, right) { return left.t - right.t; });
      stageState.linesRaw = cleaned;
      stageState.lines = cleaned.length;
      stageState.idx = -1;
      if (cleaned.length === 0) {
        resetLyrics();
        dom.slotPrev.classList.add('hidden');
        dom.slotNow.classList.add('hidden');
        dom.slotNext.classList.add('hidden');
        dom.emptyState.classList.remove('hidden');
      } else {
        dom.slotPrev.classList.remove('hidden');
        dom.slotNow.classList.remove('hidden');
        dom.slotNext.classList.remove('hidden');
        dom.emptyState.classList.add('hidden');
        stageState.idx = findLineIndex(cleaned, stageState.t);
        renderLyric();
      }
      setMeta(stageState.song);
      applyAccent(safe.accent);
      stageState.started = true;
    } catch (error) { reportError('init', error); }
  }

  function handleTick(payload) {
    try {
      var safe = payload && typeof payload === 'object' ? payload : {};
      var time = Number(safe.time);
      if (Number.isFinite(time)) { stageState.t = time; }
      stageState.playing = safe.playing === undefined ? true : !!safe.playing;
      var index = findLineIndex(stageState.linesRaw, stageState.t);
      if (index !== stageState.idx) {
        stageState.idx = index;
        renderLyric();
      } else {
        updateReveal(stageState.t);
        updateProgressBar(stageState.t);
      }
    } catch (error) { reportError('tick', error); }
  }

  var audioState = {
    bass: 0, mid: 0, treble: 0, level: 0,
    targetBass: 0, targetMid: 0, targetTreble: 0, targetLevel: 0,
    beat: 0, beatIndex: -1, bpm: 0, playing: true, lastLiveAt: -1
  };

  function handleBeat(payload) {
    try {
      var safe = payload && typeof payload === 'object' ? payload : {};
      var level = clampNumber(Number(safe.level), 0, 1);
      audioState.beat = Math.max(audioState.beat, level > 0.02 ? level : 0.6);
      var index = Number(safe.index);
      if (Number.isFinite(index)) { audioState.beatIndex = index; }
    } catch (error) { reportError('beat', error); }
  }

  function handleLive(payload) {
    try {
      var safe = payload && typeof payload === 'object' ? payload : {};
      audioState.targetBass = clampNumber(Number(safe.bass), 0, 1);
      audioState.targetMid = clampNumber(Number(safe.mid), 0, 1);
      audioState.targetTreble = clampNumber(Number(safe.treble), 0, 1);
      audioState.targetLevel = clampNumber(Number(safe.level), 0, 1);
      var bpm = Number(safe.bpm);
      if (Number.isFinite(bpm) && bpm > 0) { audioState.bpm = clampNumber(bpm, 20, 300); }
      audioState.playing = safe.playing === undefined ? true : !!safe.playing;
      audioState.lastLiveAt = stageState.t;
    } catch (error) { reportError('live', error); }
  }

  function smoothAudio() {
    var ease = 0.16;
    audioState.bass += (audioState.targetBass - audioState.bass) * ease;
    audioState.mid += (audioState.targetMid - audioState.mid) * ease;
    audioState.treble += (audioState.targetTreble - audioState.treble) * ease;
    audioState.level += (audioState.targetLevel - audioState.level) * ease;
    audioState.beat *= 0.925;
    if (audioState.beat < 0.001) { audioState.beat = 0; }
  }

  var lastSignalAt = 0;
  function updateSignalBars(now) {
    if (now - lastSignalAt < 90) { return; }
    lastSignalAt = now;
    var bars = dom.signalBars;
    for (var i = 0; i < bars.length && i < 3; i += 1) {
      var value = i === 0 ? audioState.bass : (i === 1 ? audioState.mid : audioState.treble);
      var grown = clampNumber(0.12 + value * 0.88, 0.12, 1);
      bars[i].style.transform = 'scaleY(' + grown.toFixed(3) + ')';
      bars[i].style.opacity = (0.4 + value * 0.55).toFixed(2);
    }
  }

  window.addEventListener('message', function (event) {
    var data = event && event.data;
    if (!data || data.__c100 !== 1) { return; }
    if (data.type === 'init') { handleInit(data.payload); }
    else if (data.type === 'tick') { handleTick(data.payload); }
    else if (data.type === 'beat') { handleBeat(data.payload); }
    else if (data.type === 'live') { handleLive(data.payload); }
  }, false);

  /* ---------- 渲染层 ---------- */
  var glState = null;
  var canvasState = null;

  var CUBE_CORNERS = [
    [-0.5, -0.5, -0.5], [0.5, -0.5, -0.5], [-0.5, 0.5, -0.5], [0.5, 0.5, -0.5],
    [-0.5, -0.5, 0.5], [0.5, -0.5, 0.5], [-0.5, 0.5, 0.5], [0.5, 0.5, 0.5]
  ];
  var CUBE_EDGES = [
    [0, 1], [1, 3], [3, 2], [2, 0],
    [4, 5], [5, 7], [7, 6], [6, 4],
    [0, 4], [1, 5], [2, 6], [3, 7]
  ];

  function pseudoRandom(index, salt) {
    var value = Math.sin(index * 12.9898 + salt * 78.233) * 43758.5453;
    return value - Math.floor(value);
  }

  function matrixPerspective(fovRadians, aspect, near, far) {
    var focal = 1 / Math.tan(fovRadians / 2);
    return new Float32Array([
      focal / aspect, 0, 0, 0,
      0, focal, 0, 0,
      0, 0, (far + near) / (near - far), -1,
      0, 0, (2 * far * near) / (near - far), 0
    ]);

    'uniform float uBass;',
    'uniform float uTreble;',
    'uniform float uBeat;',
    'uniform float uScale;',
    'uniform float uAlpha;',
    'uniform float uSpin;',

    var context = null;
    try { context = glow.getContext('2d'); } catch (error) { reportError('glow-context', error); }
    if (!context || typeof context.createRadialGradient !== 'function') { return null; }
    try {
      var gradient = context.createRadialGradient(256, 256, 0, 256, 256, 256);
      gradient.addColorStop(0, 'rgba(' + channelText(accentRgb[0]) + ',' + channelText(accentRgb[1]) + ',' + channelText(accentRgb[2]) + ',0.9)');
      gradient.addColorStop(0.34, 'rgba(' + channelText(accentRgb[0]) + ',' + channelText(accentRgb[1]) + ',' + channelText(accentRgb[2]) + ',0.24)');
      gradient.addColorStop(1, 'rgba(' + channelText(accentAltRgb[0]) + ',' + channelText(accentAltRgb[1]) + ',' + channelText(accentAltRgb[2]) + ',0)');
      context.fillStyle = gradient;
      context.fillRect(0, 0, 512, 512);
    } catch (error) {
      reportError('glow-paint', error);
      return null;
    }
    return glow;
  }

  function resizeFallback() {
    if (!canvasState) { return; }
    var width = window.innerWidth;
    var height = window.innerHeight;
    if (!Number.isFinite(width) || width <= 0) { width = 1440; }
    if (!Number.isFinite(height) || height <= 0) { height = 900; }
    var ratio = Math.min(window.devicePixelRatio || 1, 1.5);
    canvasState.width = Math.max(4, Math.round(width * ratio));
    canvasState.height = Math.max(4, Math.round(height * ratio));
    if (canvasState.context.canvas.width !== canvasState.width) { canvasState.context.canvas.width = canvasState.width; }
    if (canvasState.context.canvas.height !== canvasState.height) { canvasState.context.canvas.height = canvasState.height; }
  }

  function drawFallback(now) {
    if (!canvasState) { return; }
    var context = canvasState.context;
    var width = canvasState.width;
    var height = canvasState.height;
    var seconds = now * 0.001;
    var spin = stageState.rm ? 0.25 : 1;
    var level = clampNumber(audioState.level + audioState.bass * 0.4, 0, 1);

    context.setTransform(1, 0, 0, 1, 0, 0);
    context.globalCompositeOperation = 'source-over';
    context.globalAlpha = 1;
    context.fillStyle = '#05060a';
    context.fillRect(0, 0, width, height);

    if (canvasState.glowCanvas && typeof context.drawImage === 'function' &&
        canvasState.glowCanvas.width > 0 && canvasState.glowCanvas.height > 0) {
      context.globalCompositeOperation = 'lighter';
      context.globalAlpha = 0.2 + level * 0.22;
      var size = Math.max(width, height) * 1.7;
      context.drawImage(canvasState.glowCanvas, (width - size) / 2, (height - size) / 2, size, size);
      context.globalAlpha = 1;
    }

    if (typeof context.beginPath !== 'function') { return; }
    context.globalCompositeOperation = 'lighter';
    var centerX = width * 0.5;
    var centerY = height * 0.44;
    var baseRadius = Math.min(width, height) * 0.3;
    for (var ring = 0; ring < canvasState.rings; ring += 1) {
      var sides = 6 + ring;
      var ringRadius = baseRadius * (0.55 + ring * 0.28) * (1 + audioState.bass * 0.12);
      var rotation = seconds * (0.18 + ring * 0.05) * spin * (ring % 2 === 0 ? 1 : -1);
      context.beginPath();
      for (var vertex = 0; vertex <= sides; vertex += 1) {
        var angle = rotation + (vertex / sides) * Math.PI * 2;
        var pointX = centerX + Math.cos(angle) * ringRadius;
        var pointY = centerY + Math.sin(angle) * ringRadius * 0.72;
        if (vertex === 0) { context.moveTo(pointX, pointY); }
        else { context.lineTo(pointX, pointY); }
      }
      context.strokeStyle = 'rgba(' + channelText(accentRgb[0]) + ',' + channelText(accentRgb[1]) + ',' +
        channelText(accentRgb[2]) + ',' + (0.1 + 0.24 / (ring + 1) + level * 0.12).toFixed(3) + ')';
      context.lineWidth = Math.max(0.6, 0.8 + ring * 0.12);
      context.stroke();
    }
    context.globalCompositeOperation = 'source-over';
  }

  function frame(now) {
    var frameStart = (window.performance && performance.now) ? performance.now() : now;
    stageState.frames += 1;
    try { smoothAudio(); } catch (error) { reportError('smoothAudio', error); }
    try {
      if (glState) { drawGl(frameStart); }
      else if (canvasState) { drawFallback(frameStart); }
    } catch (error) { reportError('draw', error); }
    try { updateSignalBars(frameStart); } catch (error) { reportError('signalBars', error); }
    try {
      if (glState) {
        if (stageState.js > 26) { glState.slowFrames += 1; } else { glState.slowFrames = 0; }
        if (glState.slowFrames > 45 && glState.quality > 0.6) {
          glState.quality = 0.6;
          glState.slowFrames = 0;
          resizeGl();
        }
      }
    } catch (error) { reportError('adaptive', error); }
    var frameEnd = (window.performance && performance.now) ? performance.now() : Date.now();
    stageState.js = Math.round((frameEnd - frameStart) * 10) / 10;
    requestAnimationFrame(frame);
  }

  var resizeTimer = null;
  window.addEventListener('resize', function () {
    if (resizeTimer !== null) { clearTimeout(resizeTimer); }
    resizeTimer = setTimeout(function () {
      resizeTimer = null;
      try {
        if (glState) { resizeGl(); }
        else { resizeFallback(); }
      } catch (error) { reportError('resize', error); }
    }, 120);
  }, false);

  requestAnimationFrame(frame);
  requestAnimationFrame(function () {
    setTimeout(function () {
      try { setupGl(); } catch (error) { reportError('boot-renderer', error); }
    }, 0);
  });
})();
</script>
