<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>午夜访客</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#05030f}
  body{
    font-family:"Comic Sans MS","微软雅黑","PingFang SC",system-ui,sans-serif;
    color:#ece9ff;-webkit-font-smoothing:antialiased;
  }
  .hide{display:none !important}
  #stage{position:fixed;inset:0;overflow:hidden;isolation:isolate}
  #bgA,#bgB{position:absolute;inset:-30%;background-repeat:repeat;z-index:0;
    image-rendering:pixelated;background-color:#07031a}
  #bgA{background-size:256px 256px;animation:driftA 140s linear infinite}
  #bgB{background-size:160px 160px;opacity:.55;mix-blend-mode:screen;animation:driftB 23s linear infinite}
  @keyframes driftA{from{transform:translate3d(0,0,0)}to{transform:translate3d(-256px,-256px,0)}}
  @keyframes driftB{from{transform:translate3d(0,0,0)}to{transform:translate3d(160px,160px,0)}}
  @media (prefers-reduced-motion: reduce){
    #bgA,#bgB{animation:none}
    #marq .mq{animation-duration:60s}
  }
  #glow{position:absolute;inset:0;z-index:1;pointer-events:none;
    background:
      radial-gradient(19vmin 19vmin at 84% 14%,rgba(226,214,255,.50) 0%,rgba(190,170,255,.22) 58%,rgba(120,80,200,0) 72%),
      radial-gradient(5vmin 5vmin at 80.5% 11%,rgba(120,96,180,.28) 0%,rgba(120,96,180,0) 100%),
      radial-gradient(3.2vmin 3.2vmin at 88% 19%,rgba(120,96,180,.24) 0%,rgba(120,96,180,0) 100%),
      radial-gradient(2.4vmin 2.4vmin at 86% 9.4%,rgba(120,96,180,.22) 0%,rgba(120,96,180,0) 100%),
      radial-gradient(60% 55% at 50% 42%,rgba(120,60,220,.30),rgba(10,4,30,0) 70%),
      radial-gradient(120% 100% at 50% 50%,rgba(4,2,12,0) 40%,rgba(3,1,10,.85) 100%);}
  #ui{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;
      padding:clamp(8px,1.6vmin,20px);pointer-events:none}
  #fx{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
  #fxTop{position:absolute;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}

  /* ---- 铬骷髅：3D 旋转，贴在页面左边栏（窄屏退到面板后面当水印） ---- */
  #skullBox{position:absolute;z-index:4;left:clamp(4px,1.6vw,26px);top:46%;
    width:min(30vmin,250px);height:min(30vmin,250px);
    transform:translateY(-50%);pointer-events:none;opacity:.96}
  #skullBox::before{content:"";position:absolute;inset:-14%;border-radius:50%;
    background:repeating-conic-gradient(from 0deg at 50% 50%,
      rgba(255,214,255,.22) 0deg 2deg, rgba(255,214,255,0) 2deg 9deg,
      rgba(140,240,255,.16) 9deg 11deg, rgba(140,240,255,0) 11deg 20deg);
    -webkit-mask-image:radial-gradient(circle at 50% 50%,#000 12%,rgba(0,0,0,.5) 42%,transparent 70%);
    mask-image:radial-gradient(circle at 50% 50%,#000 12%,rgba(0,0,0,.5) 42%,transparent 70%);
    animation:spin 44s linear infinite;filter:blur(.3px)}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){ #skullBox::before{animation-duration:180s} }
  #skull{position:absolute;inset:0;width:100%;height:100%;display:block;
    filter:drop-shadow(0 0 10px rgba(150,240,255,.5))}
  #skullCap{position:absolute;left:0;right:0;bottom:-2%;text-align:center;
    font:700 clamp(7px,1.2vmin,11px)/1.4 "Courier New",monospace;letter-spacing:.22em;
    color:#ffd9f6;text-shadow:0 0 8px #ff3fa8;opacity:.9}

  header#top{flex:0 0 auto;text-align:center;padding-bottom:clamp(4px,1vmin,10px)}
  #tape{display:inline-block;font:700 clamp(8px,1.35vmin,12px)/1.6 "Courier New",monospace;
    letter-spacing:.18em;color:#2a0a18;padding:2px 14px;border-radius:2px;
    background:repeating-linear-gradient(45deg,#ffd94a 0 12px,#3a1020 12px 24px);
    box-shadow:0 0 10px rgba(255,90,180,.6);}
  #tape span{background:#ffd94a;padding:1px 6px;display:inline-block}
  #title{font-family:Impact,"Arial Black","微软雅黑",sans-serif;
    font-size:clamp(24px,6.2vmin,74px);line-height:.98;letter-spacing:.02em;
    padding:.06em .12em .12em;display:inline-block;max-width:96vw;
    color:#ffc93a;
    -webkit-text-stroke:clamp(1px,.28vmin,2px) #fff0f8;
    filter:drop-shadow(0 2px 0 #7a0038) drop-shadow(0 0 14px rgba(255,60,150,.85)) drop-shadow(0 0 34px rgba(255,150,40,.45));
    animation:flick 2.6s steps(4) infinite}
  @supports ((-webkit-background-clip:text) or (background-clip:text)){
    #title{
      background:linear-gradient(180deg,#fff9c4 0%,#ffd23f 24%,#ff8a00 52%,#ff2f6d 72%,#c2007a 100%);
      -webkit-background-clip:text;background-clip:text;color:transparent}
  }
  @keyframes flick{
    0%,100%{filter:drop-shadow(0 2px 0 #7a0038) drop-shadow(0 0 14px rgba(255,60,150,.85)) drop-shadow(0 0 34px rgba(255,150,40,.45))}
    50%{filter:drop-shadow(0 2px 0 #7a0038) drop-shadow(0 0 20px rgba(255,130,60,.95)) drop-shadow(0 0 46px rgba(255,60,150,.62))}}
  @media (prefers-reduced-motion: reduce){ #title{animation:none} }
  #marq{margin-top:clamp(2px,.6vmin,6px);border-top:1px solid rgba(255,150,220,.35);
        border-bottom:1px solid rgba(255,150,220,.35);overflow:hidden;height:clamp(14px,2.4vmin,22px)}
  #marq .mq{white-space:nowrap;display:inline-block;font:700 clamp(9px,1.5vmin,13px)/1.8 "Courier New",monospace;
    letter-spacing:.12em;color:#ffd8f2;text-shadow:0 0 8px #ff2f9e;animation:marq 22s linear infinite}
  @keyframes marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  #rainbow{height:clamp(3px,.55vmin,6px);margin:clamp(2px,.7vmin,6px) auto 0;
    width:min(92vw,820px);border-radius:3px;
    background:linear-gradient(90deg,#ff2f9e,#ffd23f,#5cff9d,#8ff4ff,#b06bff,#ff2f9e);
    background-size:50% 100%;background-repeat:repeat-x;
    box-shadow:0 0 12px rgba(255,110,220,.6);
    animation:rb 7s linear infinite}
  @keyframes rb{to{background-position:100% 0}}
  @media (prefers-reduced-motion: reduce){ #rainbow{animation-duration:40s} }

  main#main{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
  #panel{position:relative;width:min(92vw,820px);height:100%;max-height:100%;
    border:3px solid #d9c9ff;border-right-color:#3b2a63;border-bottom-color:#3b2a63;
    background:rgba(9,4,26,.74);
    -webkit-backdrop-filter:blur(2px) saturate(1.05);
    backdrop-filter:blur(2px) saturate(1.05);
    box-shadow:0 0 0 2px #150a2c, 0 0 26px rgba(255,80,190,.35), inset 0 0 60px rgba(80,30,160,.45);}
  #panel::before{content:"";position:absolute;inset:-5px;pointer-events:none;z-index:3;
    background:
      radial-gradient(circle,rgba(255,255,255,.98) 0 1.6px,rgba(255,110,215,.9) 1.6px 3.4px,rgba(255,110,215,0) 3.4px) left top/14px 14px no-repeat,
      radial-gradient(circle,rgba(255,255,255,.98) 0 1.6px,rgba(140,240,255,.9) 1.6px 3.4px,rgba(140,240,255,0) 3.4px) right top/14px 14px no-repeat,
      radial-gradient(circle,rgba(255,255,255,.98) 0 1.6px,rgba(140,240,255,.9) 1.6px 3.4px,rgba(140,240,255,0) 3.4px) left bottom/14px 14px no-repeat,
      radial-gradient(circle,rgba(255,255,255,.98) 0 1.6px,rgba(255,110,215,.9) 1.6px 3.4px,rgba(255,110,215,0) 3.4px) right bottom/14px 14px no-repeat;}
  #panel::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;
    box-shadow:inset 0 0 0 1px rgba(255,214,250,.20), inset 0 0 46px rgba(255,60,180,.14);}
  #list{position:absolute;inset:0;padding:0 clamp(10px,3vw,44px);z-index:1;overflow:hidden;
    -webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,0) 0%,#000 11%,#000 89%,rgba(0,0,0,0) 100%);
    mask-image:linear-gradient(to bottom,rgba(0,0,0,0) 0%,#000 11%,#000 89%,rgba(0,0,0,0) 100%)}
  /* 真正的滚动内容：必须比 #list 高，且不能把 transform 挂在被 overflow:hidden
     裁成 425px 的 #list 上，否则所有行都在裁切区外，整块歌词不显示。 */
  #listTrack{position:relative;display:flex;flex-direction:column;align-items:center;width:100%;
    will-change:transform;transition:transform .42s cubic-bezier(.22,.9,.25,1)}
  .ln{flex:0 0 auto;width:100%;text-align:center;padding:.22em 0;position:relative;z-index:0;
      color:#9d95c9;font-weight:700;line-height:1.24;letter-spacing:.01em;
      text-shadow:0 2px 6px rgba(0,0,0,.85);overflow-wrap:anywhere;
      transition:transform .34s ease, opacity .34s ease}
  .ln.past{opacity:.42}
  .ln.on{color:#fff4c8;transform:scale(1.035)}
  .ln.on::before{content:"";position:absolute;left:4%;right:4%;top:-6%;bottom:-6%;z-index:-1;
    background:radial-gradient(62% 110% at 50% 50%,rgba(255,110,200,.26),rgba(255,186,80,.12) 56%,rgba(255,186,80,0) 80%);
    filter:blur(8px)}
  .ln .c{color:inherit}
  .ln.on .c{color:#c8c0ec;text-shadow:0 2px 6px rgba(0,0,0,.9)}
  .ln.on .c.lit{color:#fff8dc;
    text-shadow:0 0 6px #ffd23f,0 0 16px #ff9a3c,0 0 26px #ff2f9e,2px 2px 0 #8a0044,0 0 2px #fff}
  #empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:.6em;padding:6%;text-align:center;z-index:2}
  #empty .big{font:700 clamp(15px,2.6vmin,26px)/1.5 "Comic Sans MS",sans-serif;color:#ffe6a0;
    text-shadow:0 0 10px #ff9a00,0 0 24px #ff2f9e}
  #empty .small{font:400 clamp(10px,1.7vmin,15px)/1.7 "Courier New",monospace;color:#b9b0e0}
  #empty .cur{display:inline-block;width:.62em;height:1.05em;background:#5cff9d;
    vertical-align:-.16em;margin-left:.3em;animation:blink 1s steps(2) infinite;box-shadow:0 0 10px #37ff8b}
  @keyframes blink{50%{opacity:0}}
  #hint{position:absolute;left:0;right:0;bottom:7.5%;text-align:center;z-index:2;
    font:700 clamp(9px,1.6vmin,14px)/1.4 "Courier New",monospace;letter-spacing:.34em;
    color:rgba(255,214,246,.85);text-shadow:0 0 10px #ff3fa8;animation:blink 1.9s steps(2) infinite}
  /* 分段进度条：老式 loading 条 */
  #prog{position:absolute;left:7px;right:7px;bottom:6px;height:9px;z-index:2;
    background:#0b0420;border:2px inset #6a55a8;overflow:hidden;box-shadow:0 0 12px rgba(255,60,180,.35)}
  #prog i{display:block;height:100%;width:0%;
    background:linear-gradient(90deg,#ffd23f,#ff6fd0 45%,#8ff4ff);
    background-size:200% 100%;
    box-shadow:0 0 10px rgba(255,120,220,.9);
    transition:width .18s linear;
    -webkit-mask-image:repeating-linear-gradient(90deg,#000 0 6px,rgba(0,0,0,.35) 6px 9px);
    mask-image:repeating-linear-gradient(90deg,#000 0 6px,rgba(0,0,0,.35) 6px 9px)}
  #list{bottom:26px !important}
  /* 专辑封面拍立得 */
  #pol{position:absolute;z-index:4;left:clamp(4px,1.4vw,22px);top:clamp(80px,14vh,176px);
    width:clamp(66px,11.5vmin,116px);padding:5px 5px 4px;background:#fdf6ff;
    box-shadow:0 6px 18px rgba(0,0,0,.55),0 0 22px rgba(255,80,200,.45);
    transform:rotate(-7deg);border-radius:2px}
  #pol img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;background:#231045;image-rendering:auto}
  #polPh{display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:1/1;
    background:repeating-linear-gradient(45deg,#2a1152 0 8px,#37166b 8px 16px);
    color:#ffd6f7;font:700 clamp(14px,3vmin,26px)/1 "Comic Sans MS",sans-serif;text-shadow:0 0 10px #ff3fa8}
  #polCap{font:700 clamp(6px,1.05vmin,9px)/1.5 "Courier New",monospace;letter-spacing:.1em;
    color:#7a1060;text-align:center;padding-top:2px}
  #pol::before,#pol::after{content:"";position:absolute;width:9px;height:9px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#fff,rgba(255,120,220,.95) 45%,rgba(150,0,90,.9));
    box-shadow:0 0 8px rgba(255,150,230,.9)}
  #pol::before{left:-4px;top:-4px}
  #pol::after{right:-4px;bottom:-4px}
  @media (max-width:880px){ #pol{display:none} }
  @media (max-height:640px){ #pol{display:none} }
  @media (max-width:1150px){
    #skullBox{z-index:2;left:12%;top:50%;width:min(60vmin,340px);height:min(60vmin,340px);opacity:.45}
  }
  @media (max-width:700px){
    #skullBox{left:6%;top:50%;width:min(62vmin,300px);height:min(62vmin,300px);opacity:.34}
    #panel{border-width:2px}
    #panel::before{inset:-4px}
  }
  @media (max-height:520px){
    #tape{display:none}
    #title{font-size:clamp(18px,5vh,34px) !important}
    #bot .btn{display:none}
  }

  footer#bot{flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    gap:clamp(6px,1.6vw,18px);flex-wrap:wrap;padding-top:clamp(4px,1vmin,10px);
    font:700 clamp(8px,1.4vmin,12px)/1.6 "Courier New",monospace;color:#cfc6ff}
  .btn{border:2px solid #efe4ff;border-right-color:#2a1a4a;border-bottom-color:#2a1a4a;
    background:linear-gradient(#6b3fd4,#3b1d86);padding:2px 10px;border-radius:3px;
    box-shadow:0 0 12px rgba(140,90,255,.5);white-space:nowrap}
  .hits{display:flex;align-items:center;gap:6px}
  #count{background:#02120a;color:#5cff9d;font-family:"Courier New",monospace;
    letter-spacing:.22em;padding:1px 6px;border:2px inset #7a6bb0;text-shadow:0 0 8px #37ff8b}
  .small2{color:#8f85bd;font-weight:400}
  .web{color:#c9a6ff;font-weight:700;letter-spacing:.06em;white-space:nowrap}
  .web span{color:#ff6fd0;text-shadow:0 0 8px #ff2f9e}
  @media (max-width:560px){ .btn{display:none} #tape{letter-spacing:.1em} .small2{display:none} }
</style>
</head>
<body>
<div id="stage">
  <div id="bgA"></div><div id="bgB"></div><div id="glow"></div>
  <div id="skullBox"><canvas id="skull"></canvas><div id="skullCap">★ SPINNING SKULL ★</div></div>
  <div id="pol" class="hide">
    <img id="polImg" alt="cover" />
    <div id="polPh">★</div>
    <div id="polCap">MY FAVE ALBUM</div>
  </div>
  <div id="ui">
    <header id="top">
      <div id="tape"><span>★ 本站正在装修 ★ 请戴耳机 ★ 欢迎光临 ★</span></div>
      <h1 id="title">午夜访客</h1>
      <div id="marq"><div class="mq" id="mqText">★ NOW PLAYING ★</div></div>
      <div id="rainbow"></div>
    </header>
    <main id="main">
      <div id="panel">
        <div id="list"><div id="listTrack"></div></div>
        <div id="hint" class="hide">～ 前奏 ～</div>
        <div id="prog"><i></i></div>
        <div id="empty" class="hide">
          <div class="big">♪ 本页暂无歌词 ♪</div>
          <div class="small">这首歌没有歌词，但本站依然 24 小时营业。<br>请到留言板点歌<span class="cur"></span></div>
        </div>
      </div>
    </main>
    <footer id="bot">
      <div class="web"><span>◀</span> 亮晶晶 webring <span>▶</span></div>
      <div class="hits"><span>访客计数</span><div id="count">000000</div></div>
      <div class="btn">✉ 签写留言板</div>
      <div class="btn">♥ 加入收藏夹</div>
      <div class="small2">BEST VIEWED IN 800×600 · NETSCAPE 4.0</div>
    </footer>
  </div>
  <canvas id="fx"></canvas>
  <canvas id="fxTop"></canvas>
</div>
<script>
var ST = { lines: [], idx: -1, t: 0, playing: true, frames: 0, js: 0, err: '', gl: false, rm: false, dur: 0 };
window.__stage = function () {
  try {
    var ln = ST.lines[ST.idx];
    return {
      lines: ST.lines.length,
      idx: ST.idx,
      t: ST.t,
      playing: !!ST.playing,
      frames: ST.frames,
      js: ST.js,
      err: ST.err || '',
      text: ln ? String(ln.text == null ? '' : ln.text) : '',
      gl: !!ST.gl,
      rm: !!ST.rm
    };
  } catch (e) {
    return { lines: 0, idx: -1, t: 0, playing: false, frames: ST.frames, js: ST.js, err: '', text: '', gl: !!ST.gl, rm: !!ST.rm };
  }
};
</script>
<script>
(function () {
  'use strict';
  var listEl = document.getElementById('list');
  var trackEl = document.getElementById('listTrack');
  var emptyEl = document.getElementById('empty');
  var titleEl = document.getElementById('title');
  var mqEl = document.getElementById('mqText');
  var countEl = document.getElementById('count');
  var panelEl = document.getElementById('panel');
  var hintEl = document.getElementById('hint');
  var fxEl = document.getElementById('fx');
  var fxc = fxEl && fxEl.getContext ? fxEl.getContext('2d') : null;
  var topEl = document.getElementById('fxTop');
  var topc = topEl && topEl.getContext ? topEl.getContext('2d') : null;

  var VW = 1440, VH = 900, DPR = 1;
  var accent = [255, 64, 160];
  var readySent = false;
  var now = 0, lastFrame = 0, jsAvg = 0;
  /* tick 断流兜底：记最后一次 tick 的墙钟和歌曲时间；超过 700ms 没新 tick，
     就按帧步长把 ST.t 往前推。tick 恢复后会被真实时间覆盖，不会漂。 */
  var lastTickWall = 0, lastTickAt = 0;
  var view = { w: 0, h: 0 };
  var rmq = false;
  try { rmq = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) { console.error('[359] matchMedia', e); }
  ST.rm = rmq;

  function dims() {
    var w = 0, h = 0;
    try {
      w = Math.round(window.innerWidth || 0);
      h = Math.round(window.innerHeight || 0);
      if (!(w > 2) || !(h > 2)) {
        var de = document.documentElement;
        if (de) { w = Math.round(de.clientWidth || 0); h = Math.round(de.clientHeight || 0); }
      }
    } catch (e) { console.error('[359] dims', e); }
    if (!isFinite(w) || w < 2) w = 1440;
    if (!isFinite(h) || h < 2) h = 900;
    VW = w; VH = h;
    DPR = Math.min(2, Math.max(1, Math.round((window.devicePixelRatio || 1) * 100) / 100));
    if (!isFinite(DPR) || DPR < 1) DPR = 1;
    view.w = w; view.h = h;
  }

  function sendReady() {
    if (readySent) return;
    readySent = true;
    try { parent.postMessage({ __c100: 1, type: 'ready' }, '*'); }
    catch (e) { console.error('[359] ready post failed', e); }
  }
  if (window.requestAnimationFrame) requestAnimationFrame(function () { sendReady(); });
  else setTimeout(sendReady, 16);
  setTimeout(sendReady, 900);

  function num(v, d) { var n = Number(v); return (isFinite(n) ? n : d); }
  function wallNow() {
    try { return (window.performance && performance.now) ? performance.now() : Date.now(); }
    catch (e) { return Date.now(); }
  }

  function normLines(raw) {
    var out = [], i, n = 0;
    if (!Array.isArray(raw)) return out;
    n = Math.min(raw.length, 2000);
    for (i = 0; i < n; i++) {
      var o = raw[i] || {};
      var txt = (o.text == null ? '' : String(o.text));
      var t = num(o.t, 0);
      var dur = num(o.dur, 0);
      if (!(dur > 0)) dur = 4;
      var chars = null;
      if (Array.isArray(o.chars) && o.chars.length) {
        chars = [];
        var m = Math.min(o.chars.length, 800);
        for (var j = 0; j < m; j++) {
          var c = o.chars[j] || {};
          chars.push({ c: (c.c == null ? '' : String(c.c)), t: num(c.t, t) });
        }
      }
      out.push({ t: t, dur: dur, text: txt, chars: chars, cps: cpArr(txt), lit: -1 });
    }
    out.sort(function (a, b) { return a.t - b.t; });
    /* 时间轴兜底：正常 LRC 是秒；个别来源给毫秒（几十万），
       直接按毫秒比会把所有行都判成「还没到」，字幕看起来整块消失。
       超过 10000 的值统一压回秒。 */
    if (out.length && out[out.length - 1].t > 10000) {
      for (var k = 0; k < out.length; k++) {
        out[k].t = out[k].t / 1000;
        out[k].dur = out[k].dur / 1000;
        if (out[k].chars) {

    if (ni >= 0) {
      for (i = Math.max(0, ni - 40); i < ni; i++) {
        if (ST.lines[i] && ST.lines[i].el) ST.lines[i].el.className = 'ln past';
      }
      if (ST.lines[ni] && ST.lines[ni].el) ST.lines[ni].el.className = 'ln on';
    }
    if (hintEl) hintEl.className = (ST.lines.length && ni < 0) ? '' : 'hide';
    scrollToCurrent();
  }

  /* 歌词同步的唯一入口：init / tick / 断流兜底都走这里。
     以前只在 tick 里算，tick 一断（或首帧还没来）就整块停在「前奏」。 */
  function syncLyric(force) {
    if (!ST.lines.length) {
      if (emptyEl) emptyEl.className = '';
      return;
    }
    if (emptyEl) emptyEl.className = 'hide';
    var ni = findIdx(ST.t);
    setIdx(ni, force);
    var ln = ni >= 0 ? ST.lines[ni] : null;
    if (ln) paintLit(ln, litCount(ln, ST.t));
    paintProgress();
  }

  function scrollToCurrent() {
    var ln = ST.idx >= 0 ? ST.lines[ST.idx] : null;
    var ph = (listEl && listEl.clientHeight) ? listEl.clientHeight
      : ((panelEl && panelEl.clientHeight) ? panelEl.clientHeight : VH * 0.5);
    if (!(ph > 20)) ph = 400;
    var y = 0;
    if (ln && ln.el) y = ph * 0.46 - (ln.el.offsetTop + ln.el.offsetHeight * 0.5);
    (trackEl || listEl).style.transform = 'translateY(' + Math.round(y) + 'px)';
  }

  var beatCount = 0, counterVal = 1157;
  function paintCounter() {
    var v = Math.round(counterVal) % 1000000;
    if (!isFinite(v)) v = 0;
    if (v < 0) v += 1000000;
    var s = '000000' + String(v);
    countEl.textContent = s.slice(-6);
  }
  function bumpCounter(n) {
    var k = Number(n);
    if (!isFinite(k)) k = 1;
    counterVal = (counterVal + k) % 1000000;
    paintCounter();
  }
  function onBeat(p) {
    beatCount++;
    var lvl = Number(p && p.level);
    if (!isFinite(lvl)) lvl = 0.6;
    lvl = Math.max(0, Math.min(1, lvl));
    FX.flash = Math.max(FX.flash, 0.30 + 0.60 * lvl);
    SK.flash = Math.min(1.3, 0.25 + lvl);
    if (!rmq && fxc) {
      spawnBurst(VW * (0.28 + Math.random() * 0.44), VH * (0.26 + Math.random() * 0.40), lvl > 0.62);
      if (lvl > 0.82) spawnBurst(VW * 0.5, VH * 0.46, true);
    }
    if (beatCount % 12 === 0) bumpCounter(1);
  }
  function onLive(p) {
    if (!p || typeof p !== 'object') return;
    var l = Number(p.level), b = Number(p.bass);
    FX.lvl = isFinite(l) ? Math.max(0, Math.min(1, l)) : FX.lvl;
    FX.bass = isFinite(b) ? Math.max(0, Math.min(1, b)) : FX.bass;
    if (typeof p.playing === 'boolean') ST.playing = p.playing;
  }

  function onTick(p) {
    if (!p || typeof p !== 'object') return;
    var t = Number(p.time);
    if (isFinite(t)) ST.t = Math.max(0, t);
    if (typeof p.playing === 'boolean') ST.playing = p.playing;
    lastTickAt = ST.t;
    lastTickWall = wallNow();
    syncLyric();
  }
  var progEl = null, lastPct = -1;
  function paintProgress() {
    try {
      if (!progEl) {
        var box = document.getElementById('prog');
        progEl = box ? box.firstElementChild : null;
        if (!progEl && box) {
          progEl = document.createElement('i');
          box.appendChild(progEl);
        }
      }
      if (!progEl) return;
      var d = ST.dur;
      var pct = (isFinite(d) && d > 0.5) ? Math.round(Math.max(0, Math.min(1, ST.t / d)) * 100) : 0;
      if (pct === lastPct) return;
      lastPct = pct;
      progEl.style.width = pct + '%';
    } catch (e) { console.error('[359] paintProgress', e); }
  }

  window.addEventListener('message', function (ev) {
    var d = ev && ev.data;
    if (!d || typeof d !== 'object' || d.__c100 !== 1) return;
    try {
      if (d.type === 'init') applyInit(d.payload);
      else if (d.type === 'tick') onTick(d.payload);
      else if (d.type === 'beat') onBeat(d.payload);
      else if (d.type === 'live') onLive(d.payload);
    } catch (e) { console.error('[359] message ' + d.type, e); }
  }, false);

  function fitCanvas(el, c) {
    if (!el) return;
    el.width = Math.max(1, Math.round(VW * DPR));
    el.height = Math.max(1, Math.round(VH * DPR));
    el.style.width = VW + 'px';
    el.style.height = VH + 'px';
    if (c) { try { c.setTransform(DPR, 0, 0, DPR, 0, 0); } catch (e) { console.error('[359] setTransform', e); } }
  }
  function resize() {
    dims();
    fitCanvas(fxEl, fxc);
    fitCanvas(topEl, topc);
    sizeSkull();
    FX.phone = buildPhone();
    layoutTitle();
    layoutLines();
    FX.panel = panelRect();
    scrollToCurrent();
  }

  function frame(ts) {
    requestAnimationFrame(frame);
    var t0 = 0;
    try { t0 = (window.performance && performance.now) ? performance.now() : Date.now(); } catch (e) { t0 = Date.now(); }
    now = ts || t0;
    try {
      if (fxc) {
        fxc.clearRect(0, 0, VW, VH);
      }
      var since = SK.last ? (now - SK.last) : 60;
      if (since > 48) {
        if (SK.ok) drawSkull(Math.min(0.12, since / 1000));
        else drawSkull2d(Math.min(0.12, since / 1000));
        SK.last = now;
      }
      var sdt = FX.last ? (now - FX.last) / 1000 : 0.016;
      if (!isFinite(sdt) || sdt < 0) sdt = 0.016;
      if (sdt > 0.25) sdt = 0.25;
      FX.last = now;
      /* tick 断流（宿主定时器被节流 / 首帧卡住）时自己往前走，字幕不至于整块停住 */
      if (ST.playing && ST.lines.length && lastTickWall && (now - lastTickWall) > 700) {
        ST.t = lastTickAt + sdt;
        lastTickAt = ST.t;
        lastTickWall = now;
        syncLyric();
      }
      drawFx(sdt);
    } catch (e) { console.error('[359] frame', e); }
    ST.frames++;
    var t1 = (window.performance && performance.now) ? performance.now() : Date.now();
    var d = t1 - t0;
    if (!isFinite(d) || d < 0) d = 0;
    jsAvg = jsAvg ? jsAvg * 0.9 + d * 0.1 : d;
    ST.js = Math.round(jsAvg * 100) / 100;
    lastFrame = now;
  }

  window.addEventListener('resize', function () { try { resize(); } catch (e) { console.error('[359] resize', e); } }, false);
  paintBg();
  initSkull();
  initFx();
  paintCounter();
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
