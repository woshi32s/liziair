<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>508 · 未来已来</title>
<script src="assets/508-three.min.js"></script>
<script src="assets/508-gsap.min.js"></script>
<script src="assets/508-three-addons.js"></script>
<script src="assets/508-latin-glyphs.js"></script>
<style>
  @font-face{font-family:UB;src:url('assets/508-unbounded.woff2') format('woff2');font-weight:200 900;font-display:block}
  @font-face{font-family:JBM;src:url('assets/508-mono.woff2') format('woff2');font-weight:100 800;font-display:block}
  @font-face{font-family:HAN;src:url('assets/508-han-black.woff2') format('woff2');font-weight:100 900;font-display:block}
  :root{--bg:#050507;--ink:#FFFFFF;--accent:#1A2BFF}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;overflow:hidden}
  #viewport{position:fixed;inset:0;overflow:hidden;background:var(--bg)}
  #main{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:var(--bg);overflow:hidden}
  #main canvas{position:absolute;left:0;top:0;display:block;width:1920px;height:1080px}
</style>
</head>
<body>
<div id="viewport">
  <div id="main" data-composition-id="main" data-start="0" data-duration="20" data-width="1920" data-height="1080" data-fps="30" data-poster-time="16">
    <canvas id="gl" width="1920" height="1080"></canvas>
    <canvas id="ui" width="1920" height="1080"></canvas>
  </div>
</div>

<script>

/* ---- 形态设置面板：宿主在 ready 后同步读取，必须先于 ready 声明 ---- */
window.__liziShake = true;
window.__stagePanel = {
  title: '未来已来',
  items: [
    { key: 'shake', label: '震动', type: 'switch', def: true }
  ]
};
addEventListener('message', function (e) {
  var d = e.data;
  if (!d || d.__c100 !== 1 || d.type !== 'setting' || !d.payload) return;
  if (d.payload.key === 'shake') window.__liziShake = d.payload.value !== false;
});
/* ============================================================
   The Future Is Already Here — a 20-second tech reel at 120 BPM.
   Cubes → SIGNAL → retina → word tunnel → THE FUTURE → desktop →
   countdown → four glass objects → vortex → chrome hero → end card.
   Two stacked canvases: #gl (three.js) under #ui (2D type and HUD).
   One clock: render(t) draws every frame from timeline time.
   ============================================================ */
const CFG = {
  duration: 20, w: 1920, h: 1080, bpm: 120, reducedAt: 17.0,
  // Copy: change these to retell the film for another brand or message.
  // 3D 字：拉丁 assets/508-latin-glyphs.js，汉字 assets/508-han-glyphs.js（延后加载）
  brand: 'LIZI/508',
  headline: 'THE FUTURE IS ALREADY HERE',
  hero: 'FUTURE',                       // chrome 3D word in the closing shot; long words scale to fit
  heroLine: 'IS ALREADY HERE.',
  date: '2026.09.27',
  signal: 'SIGNAL',
  wake: 'WAKE UP',
  awaken: 'AWAKEN',
  tags: ['FUTURE', 'ALREADY', 'HERE'],
  objects: ['PRISM', 'BOLT', 'PLANET', 'MIND'],   // type behind the four glass objects
  endLine: 'END OF TRANSMISSION'
};

/* ======== core ======== */
// Shared helpers for the replica: palette, easing, 2D type, HUD, three.js setup.

const W = 1920, H = 1080;
/* BPM / BEAT 原来写死 120，接进播放器后要跟着歌变 —— 改成可变 */
let BPM = 120, BEAT = 0.5;
const C = { blue: '#1A2BFF', blue2: '#3344FF', deep: '#0B1060', ink: '#0A0A0F', paper: '#EDEDE8', white: '#FFFFFF', lav: '#C9C6FF', dim: '#8F97FF' };
const UB = 'UB, "Arial Black", sans-serif';
const CJK = 'HAN, UB, "Microsoft YaHei", "PingFang SC", sans-serif';
const MONO = 'JBM, ui-monospace, Menlo, monospace';

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const TAU = Math.PI * 2;
function rnd(i) { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
const EZ = {
  o2: p => 1 - (1 - p) ** 2, o3: p => 1 - (1 - p) ** 3, o4: p => 1 - (1 - p) ** 4, i3: p => p ** 3, i2: p => p * p,
  io3: p => p < .5 ? 4 * p ** 3 : 1 - (-2 * p + 2) ** 3 / 2, io2: p => p < .5 ? 2 * p * p : 1 - (-2 * p + 2) ** 2 / 2,
  expo: p => p >= 1 ? 1 : 1 - 2 ** (-10 * p), back: p => { const c = 1.70158 * 1.3, c3 = c + 1; return 1 + c3 * (p - 1) ** 3 + c * (p - 1) ** 2; },
};

/* ---------- 2D ---------- */
const ui = document.getElementById('ui').getContext('2d');
let CUR = ui; // helpers draw into CUR; target(g) redirects them to another canvas
function target(g) { CUR = g || ui; }
function text(s, x, y, size, color, o = {}) {
  const g = o.g || CUR; g.save();
  g.font = `${o.w || 900} ${size}px ${o.f || UB}`; g.textAlign = o.align || 'left'; g.textBaseline = o.base || 'alphabetic';
  g.globalAlpha = o.a ?? 1; g.translate(x, y); if (o.rot) g.rotate(o.rot); g.scale(o.sx || 1, o.sy || 1); g.letterSpacing = (o.ls ?? 0) + 'px';
  if (o.stroke) { g.lineWidth = o.stroke; g.strokeStyle = color; g.lineJoin = 'round'; g.strokeText(s, 0, 0); }
  else { g.fillStyle = color; g.fillText(s, 0, 0); }
  g.restore();
}
const mono = (s, x, y, size, color, o = {}) => text(s, x, y, size, color, { w: 600, ls: 1.5, ...o, f: o.f || MONO });
function measure(s, size, o = {}) { ui.save(); ui.font = `${o.w || 900} ${size}px ${o.f || UB}`; ui.letterSpacing = (o.ls ?? 0) + 'px'; const m = ui.measureText(s).width; ui.restore(); return m; }
function fill(c) { CUR.fillStyle = c; CUR.fillRect(0, 0, W, H); }
function rect(x, y, w, h, c) { CUR.fillStyle = c; CUR.fillRect(x, y, w, h); }
function line(x1, y1, x2, y2, c, w = 1.5) { CUR.strokeStyle = c; CUR.lineWidth = w; CUR.beginPath(); CUR.moveTo(x1, y1); CUR.lineTo(x2, y2); CUR.stroke(); }
function barcode(x, y, w, h, seed, col, g = CUR) { g.fillStyle = col; let cx = x, k = 0; while (cx < x + w) { const bw = 1 + Math.floor(rnd(seed + k) * 4); if (k % 2 === 0) g.fillRect(cx, y, bw, h); cx += bw; k++; } }
function brackets(x, y, w, h, col, l = 18, lw = 1.5) {
  const g = CUR; g.strokeStyle = col; g.lineWidth = lw; g.beginPath();
  [[x, y, 1, 1], [x + w, y, -1, 1], [x, y + h, 1, -1], [x + w, y + h, -1, -1]].forEach(([px, py, sx, sy]) => { g.moveTo(px + l * sx, py); g.lineTo(px, py); g.lineTo(px, py + l * sy); });
  g.stroke();
}
function sparkle(x, y, r, col = '#fff', rot = 0, g = CUR) {
  g.save(); g.translate(x, y); g.rotate(rot); g.fillStyle = col; g.beginPath();
  for (let i = 0; i < 4; i++) { const a = i / 4 * TAU; g.quadraticCurveTo(Math.cos(a - TAU / 8) * r * .12, Math.sin(a - TAU / 8) * r * .12, Math.cos(a) * r, Math.sin(a) * r); }
  g.quadraticCurveTo(Math.cos(-TAU / 8) * r * .12, Math.sin(-TAU / 8) * r * .12, r, 0); g.closePath(); g.fill(); g.restore();
}
function typed(s, p) { return s.slice(0, Math.floor([...s].length * clamp(p))); }
function scramble(s, p, seed = 1) { const n = Math.floor(s.length * clamp(p)); const pool = '#&%$@01ABXZ'; return s.slice(0, n) + (n < s.length ? pool[Math.floor(rnd(seed + n) * pool.length)] : ''); }
// Tag row under hero type: FUTURE · ALREADY · HERE, one boxed.
function tagRow(cx, y, hi, fg, bg) {
  const words = CFG.tags; const ws = words.map(w => measure(w, 26, { w: 900 }) + 16); const gap = 50;
  let x = cx - (ws.reduce((a, b) => a + b, 0) + gap * 2) / 2;
  words.forEach((w, i) => {
    if (i === hi) rect(x - 4, y - 30, ws[i], 40, fg);
    text(w, x + 4, y, 26, i === hi ? bg : fg, { w: 900 }); x += ws[i];
    if (i < 2) { text('·', x + gap / 2 - 6, y, 26, fg, {}); x += gap; }
  });
}

/* ---------- frame HUD that runs through the whole film ---------- */
function hud(t, fg, chapter) {
  mono('● ' + CFG.brand + ' — ' + CFG.headline, 56, 50, 15, fg);
  mono(`00:${String(Math.floor(t)).padStart(2, '0')}:${String(Math.floor((t % 1) * 30)).padStart(2, '0')}`, W - 56, 50, 15, fg, { align: 'right' });
  mono(chapter, 56, H - 34, 15, fg);
  mono('120 BPM', W - 120, H - 34, 15, fg, { align: 'right' });
  ui.fillStyle = fg; const b = Math.floor(t / BEAT) % 4; for (let i = 0; i < 4; i++) { ui.globalAlpha = b === i ? 1 : .35; ui.fillRect(W - 108 + i * 14, H - 46, 9, 9); }
  ui.globalAlpha = 1;
}

/* ---------- three.js ---------- */
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: true, preserveDrawingBuffer: true, alpha: false });
renderer.setPixelRatio(1); renderer.setSize(W, H, false);
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
const pmrem = new THREE.PMREMGenerator(renderer);
const ENV = pmrem.fromScene(new THREEAddons.RoomEnvironment(), 0.03).texture;
const loader = new THREEAddons.FontLoader();
const FONT3D = { lat: loader.parse(window.__FONTS.unbounded) };
/* 汉字字形 4MB，推迟到 ready 之后再拉：首帧 ready 绝不能等它 */
let HAN_READY = false, HAN_PENDING = false;
function loadHanFont() {
  if (HAN_READY || HAN_PENDING) return;
  HAN_PENDING = true;
  const s = document.createElement('script');
  s.src = 'assets/508-han-glyphs.js';
  s.onload = () => {
    try {
      if (window.__FONTS && window.__FONTS.han) { FONT3D.han = loader.parse(window.__FONTS.han); HAN_READY = true; }
    } catch (e) { console.warn('han glyph parse failed', e); }
    HAN_PENDING = false;
    try { if (window.__S508) window.__S508.dirty = true; } catch (e) { }
  };
  s.onerror = () => { HAN_PENDING = false; };
  document.head.appendChild(s);
}
const geoCache = new Map();
// Extruded glyph geometry, centered on its own box.
function glyphGeo(s, font, size, depth, bevel = size * 0.03) {
  const key = [s, font, size, depth, bevel].join('|'); if (geoCache.has(key)) return geoCache.get(key);
  const g = new THREEAddons.TextGeometry(s, { font: FONT3D[font], size, depth, curveSegments: 6, bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel * 0.7, bevelSegments: 3 });
  g.computeBoundingBox(); const b = g.boundingBox; g.translate(-(b.max.x + b.min.x) / 2, -(b.max.y + b.min.y) / 2, -(b.max.z + b.min.z) / 2);
  geoCache.set(key, g); return g;
}
function chromeMat(tint = '#E9E8FF', rough = 0.14) {
  return new THREE.MeshStandardMaterial({ color: new THREE.Color(tint), metalness: 1, roughness: rough, envMap: ENV, envMapIntensity: 1.25 });
}
function glassMat(o = {}) {
  return new THREE.MeshPhysicalMaterial({ color: 0xffffff, metalness: 0, roughness: 0.04, transmission: 1, thickness: 1.2, ior: 1.45, iridescence: 1, iridescenceIOR: 1.6, iridescenceThicknessRange: [180, 820], envMap: ENV, envMapIntensity: 1.4, transparent: true, ...o });
}
function clear3d(color) { renderer.setClearColor(new THREE.Color(color), 1); renderer.clear(); }
// A word as one group of per-letter meshes laid out by the font's advances,
// so letters can move individually while keeping real spacing.
function wordGroup(str, font, size, depth, mat, o = {}) {
  const f = FONT3D[font], k = size / f.data.resolution, track = (o.track ?? 0) * size; const g = new THREE.Group(); let x = 0;
  for (const ch of str) { const gl = f.data.glyphs[ch]; const adv = (gl ? gl.ha : f.data.resolution * 0.3) * k;
    if (ch !== ' ' && gl) { const m = new THREE.Mesh(glyphGeo(ch, font, size, depth, o.bevel ?? size * 0.03), mat); const cx = ((gl.x_min + gl.x_max) / 2) * k; m.position.x = x + cx; g.add(m); }
    x += adv + track; }
  g.children.forEach(m => m.position.x -= (x - track) / 2); g.userData.width = x - track; return g;
}
// A 2D canvas used as a three.js scene background, so 3D objects (and glass
// transmission) sit in front of flat graphics.
function bgCanvas(scene) {
  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; scene.background = tex;
  return { g, c, update() { tex.needsUpdate = true; } };
}

/* ======== seg1 ======== */
// Segment 1 (0–16 s): signal → retina → awaken → THE FUTURE IS ALREADY HERE → FUTURE.EXE → TOMORROW

/* ---------- A: one cube → four → sixty-four ---------- */
const A = (() => {
  const scene = new THREE.Scene(); const cam = new THREE.PerspectiveCamera(28, W / H, 0.1, 200); cam.position.set(0, 0, 26);
  scene.add(new THREE.HemisphereLight(0xdfe3ff, 0x0a0c30, 1.1)); const key = new THREE.DirectionalLight(0xffffff, 2.4); key.position.set(-6, 8, 10); scene.add(key);
  const rim = new THREE.DirectionalLight(0x8fa0ff, 1.2); rim.position.set(8, -2, -6); scene.add(rim);
  const mat = new THREE.MeshStandardMaterial({ color: new THREE.Color(C.blue), roughness: 0.42, metalness: 0.05, envMap: ENV, envMapIntensity: 0.35 });
  const box = new THREE.BoxGeometry(1, 1, 1); const inst = new THREE.InstancedMesh(box, mat, 64); scene.add(inst);
  const group = new THREE.Group(); group.add(inst); scene.add(group);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), v = new THREE.Vector3(), s = new THREE.Vector3();
  const S = 7.2;
  const cell = (n, ix, iy) => { const c = 8 / n; const cx = Math.floor(ix / c), cy = Math.floor(iy / c); const sz = S / n; return [((cx + 0.5) / n - 0.5) * S, ((cy + 0.5) / n - 0.5) * S, sz * (n === 1 ? 1 : n === 2 ? 0.94 : 0.9)]; };
  function draw(lt) {
    const born = EZ.back(seg(lt, 0.45, 0.8));
    const p2 = EZ.io3(seg(lt, 1.05, 1.35)), p8 = EZ.io3(seg(lt, 1.55, 1.85));
    for (let i = 0; i < 64; i++) {
      const ix = i % 8, iy = Math.floor(i / 8);
      const a = cell(1, ix, iy), b = cell(2, ix, iy), c = cell(8, ix, iy);
      let x = lerp(lerp(a[0], b[0], p2), c[0], p8), y = lerp(lerp(a[1], b[1], p2), c[1], p8), sz = lerp(lerp(a[2], b[2], p2), c[2], p8);
      const pop = p8 > 0 ? 1 + 0.25 * Math.sin(seg(lt, 1.55 + rnd(i) * 0.2, 1.9 + rnd(i) * 0.2) * Math.PI) : 1;
      const z = p8 * (rnd(i * 3) - 0.5) * 0.4 * (1 - seg(lt, 1.9, 2.1));
      m.compose(v.set(x, y, z), q.identity(), s.set(sz * born, sz * born * pop, sz * 0.9 * born)); inst.setMatrixAt(i, m);
    }
    inst.instanceMatrix.needsUpdate = true;
    group.rotation.set(0.12 + 0.18 * p8, -0.42 + 0.1 * lt, 0.02);
    cam.position.z = 26 - 3 * p8; cam.lookAt(0, 0, 0);
    renderer.setClearColor(0x050507, 1); renderer.render(scene, cam);
    ui.clearRect(0, 0, W, H);
    line(0, 540, W, 540, 'rgba(255,255,255,.18)'); line(960, 0, 960, H, 'rgba(255,255,255,.18)');
    if (lt < 0.5) { const k = 0.5 + 0.5 * Math.sin(lt * 30); rect(952, 524, 16, 32, `rgba(255,255,255,${k})`); }
    const n = lt < 1.2 ? 1 : lt < 1.7 ? 4 : 64, bw = [440, 560, 900][[1, 4, 64].indexOf(n)];
    if (lt > 0.45) { brackets(960 - bw / 2, 540 - bw / 2 * 0.95, bw, bw * 0.95, 'rgba(255,255,255,.75)', 18);
      mono(`CELLS ${String(n).padStart(4, '0')}`, 960 - bw / 2, 540 - bw / 2 * 0.95 - 14, 14, '#fff');
      mono('SIGNAL/01 · SOURCE', 960 + bw / 2, 540 - bw / 2 * 0.95 - 14, 14, '#9aa', { align: 'right' });
      mono('KLEIN #1A2BFF', 960 - bw / 2, 540 + bw / 2 * 0.95 + 22, 14, '#9aa');
      mono(`${633 + n * 2} × ${677 + n * 2} PX`, 960 + bw / 2, 540 + bw / 2 * 0.95 + 22, 14, '#9aa', { align: 'right' }); }
    [-600, -300, 300, 600].forEach(d => mono(String(Math.abs(d) / 3 | 0).padStart(3, '0'), 960 + d, 534, 11, 'rgba(255,255,255,.35)', { align: 'center' }));
  }
  return { t0: 0, t1: 2.1, chapter: '00 SIGNAL', fg: '#fff', three: true, draw };
})();

/* ---------- B/C/D: the signal wall resolves into SIGNAL ---------- */
const sigCells = (() => { const c = document.createElement('canvas'); c.width = 300; c.height = 70; const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.font = `900 64px ${UB}`; g.textBaseline = 'top'; g.letterSpacing = '-2px'; g.fillText(CFG.signal, 0, 0); return () => {
    g.clearRect(0, 0, 300, 70); g.font = `900 64px ${UB}`; g.fillText(CFG.signal, 0, 0);
    const d = g.getImageData(0, 0, 300, 70).data, out = []; for (let y = 0; y < 70; y += 2) for (let x = 0; x < 300; x += 2) if (d[(y * 300 + x) * 4 + 3] > 110) out.push([x / 2, y / 2]); return out; }; })();
let SIG = null;
function signalFrame(lt, blink = true) {
  if (!SIG) SIG = sigCells();
  fill('#050507'); ui.fillStyle = 'rgba(26,43,255,.13)'; for (let y = 4; y < H; y += 12) for (let x = 4; x < W; x += 12) ui.fillRect(x, y, 6, 6);
  const cols = Math.max(...SIG.map(c => c[0])) + 1, rows = Math.max(...SIG.map(c => c[1])) + 1, cs = 1400 / cols, ox = 960 - cols * cs / 2, oy = 500 - rows * cs / 2;
  SIG.forEach(([x, y], i) => { ui.fillStyle = rnd(i * 7 + Math.floor(lt * 8)) > 0.93 ? '#8A95FF' : C.blue; ui.fillRect(ox + x * cs, oy + y * cs, cs - 1.5, cs - 1.5); });
  mono('CH.01 · CARRIER LOCKED · 2026.09.27', ox, oy - 26, 15, '#C8CCFF'); mono('SNR 97.2 DB · LAT 0.00 MS', ox + cols * cs, oy - 26, 15, '#C8CCFF', { align: 'right' });
  const msg = 'INCOMING TRANSMISSION — STAND BY'; mono(typed(msg, seg(lt, 0, 0.45)) + (blink && Math.floor(lt * 6) % 2 ? '▌' : ''), ox + 10, oy + rows * cs + 52, 26, '#fff', { ls: 4 });
  barcode(ox + cols * cs - 190, oy + rows * cs + 30, 190, 26, 5, '#fff');
  ['+', '+'].forEach((s, i) => mono(s, i ? ox + cols * cs + 20 : ox - 30, oy + rows * cs + 44, 20, '#8A95FF'));
}
const B = {
  t0: 2.1, t1: 3.1, chapter: '00 SIGNAL', fg: '#fff', draw(lt) {
    const wx = lerp(-80, W + 120, EZ.io2(seg(lt, 0, 1)));
    ui.save(); ui.beginPath(); ui.rect(0, 0, Math.max(0, wx), H); ui.clip(); signalFrame(lt + 0.3, false); ui.restore();
    ui.save(); ui.beginPath(); ui.rect(wx, 0, W - wx, H); ui.clip(); fill('#060820');
    for (let y = 0; y < H; y += 13) for (let x = Math.floor(wx / 13) * 13; x < W; x += 13) { const r = rnd(x * 0.37 + y * 1.31); ui.fillStyle = r > 0.992 ? '#fff' : C.blue; ui.fillRect(x, y, 11, 11); }
    ui.restore();
    for (let y = 0; y < H; y += 13) { const j = (rnd(y + Math.floor(lt * 20)) - 0.5) * 70; for (let k = 0; k < 6; k++) { const x = wx + j + k * 11 - 30; ui.fillStyle = `rgba(255,255,255,${0.25 + rnd(y * k + 3) * 0.75})`; ui.fillRect(x, y, 11, 11); } }
    mono(`RECEIVING ${String(Math.round(lerp(62, 100, seg(lt, 0, 0.9)))).padStart(3, '0')}%`, 56, 96, 15, '#fff'); rect(56, 106, 300 * seg(lt, 0, 0.9), 3, '#fff');
    mono('CH.01 · 31,000 CELLS · PITCH 14PX', 56, 128, 12, '#9aa');
  } };
const Csig = { t0: 3.1, t1: 3.72, chapter: '00 SIGNAL', fg: '#fff', draw(lt) { signalFrame(lt + 0.45); } };
const Dsig = { t0: 3.72, t1: 4.0, chapter: '00 SIGNAL', fg: '#fff', draw(lt) {
  const p = EZ.i3(seg(lt, 0, 0.22)); fill('#050507');
  ui.save(); ui.translate(0, 540); ui.scale(1 + p * 0.1, Math.max(0.004, 1 - p)); ui.translate(0, -540); signalFrame(1.2, false); ui.restore();
  rect(0, 538, W, 4 * (1 - seg(lt, 0.2, 0.28)), '#fff'); } };

/* ---------- E/F: retinal handshake ---------- */
const sclera = (() => { const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  g.fillStyle = '#fff'; for (let y = 0; y < H; y += 9) for (let x = 0; x < W; x += 9) { const d = Math.hypot((x - 960) / 1.6, y - 540) / 520; const r = 3.6 * clamp(1.15 - d * 0.9); if (r > 0.4) { g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); } } return c; })();
function iris(cx, cy, R, lt, g = ui) {
  g.save(); g.translate(cx, cy);

  [0.22, 0.5, 0.78].forEach(y => line(0, H * y, W, H * y, 'rgba(255,255,255,.30)'));
  camPunch(d.px, d.py, d.pz, () => {
    drawLyric2D(ui, d.rows, { cx: W / 2, cy: H * 0.52, size: d.size, t0: LY.t0, t, fill: C.paper });
  });
  mono('SIGNAL LOCKED', W - 56, H * 0.22 - 12, 14, 'rgba(255,255,255,.55)', { align: 'right' });
}

/* ---- 镜头 1：铬字（源片 Hero 的材质语言，用 2D 渐变复刻） ---- */
function shotChrome(t, lt, d) {
  fill('#050507');
  const g = ui.createRadialGradient(W * 0.5, H * 0.42, 0, W * 0.5, H * 0.42, W * 0.7);
  try { g.addColorStop(0, 'rgba(24,28,80,.55)'); g.addColorStop(0.55, 'rgba(5,5,7,0)'); g.addColorStop(1, 'rgba(0,0,0,.8)'); } catch (e) { }
  ui.fillStyle = g; ui.fillRect(0, 0, W, H);
  line(0, H * 0.5, W, H * 0.5, 'rgba(255,255,255,.10)', 3);
  const grad = ui.createLinearGradient(W / 2 - W * 0.3, H * 0.24, W / 2 + W * 0.05, H * 0.76);
  try {
    grad.addColorStop(0.00, '#ffffff'); grad.addColorStop(0.16, '#E6E3FF');
    grad.addColorStop(0.34, '#8890b8'); grad.addColorStop(0.46, '#f4f4ff');
    grad.addColorStop(0.58, '#5b6390'); grad.addColorStop(0.74, '#dcdcff');
    grad.addColorStop(1.00, '#6a6f96');
  } catch (e) { }
  camPunch(d.px, d.py, d.pz, () => {
    drawLyric2D(ui, d.rows, { cx: W / 2, cy: H * 0.52, size: d.size, t0: LY.t0, t, fill: grad });
  });
  /* 镜面扫光：每 3 拍一次 */
  const ph = (S.beatPhase / 3) % 1;
  if (ph < 0.5 && !RM) {
    const x = (-0.2 + ph / 0.5 * 1.5) * W;
    ui.save(); ui.transform(1, 0, -0.35, 1, 0, 0);
    const sg2 = ui.createLinearGradient(x - 120, 0, x + 120, 0);
    try { sg2.addColorStop(0, 'rgba(255,200,255,0)'); sg2.addColorStop(0.5, 'rgba(255,215,255,.35)'); sg2.addColorStop(1, 'rgba(255,200,255,0)'); } catch (e) { }
    ui.fillStyle = sg2;
    ui.globalCompositeOperation = 'lighter';
    ui.fillRect(x - 120, 0, 240, H);
    ui.globalCompositeOperation = 'source-over';
    ui.restore();
  }
  mono('04 ARRIVAL', 56, 96, 15, 'rgba(255,255,255,.7)');
}

/* ---- 镜头 2：信号墙打格（源片 B/Csig 那味） ---- */
function shotWall(t, lt, d) {
  const cell = 13;
  fill('#050507');
  ui.fillStyle = 'rgba(26,43,255,.13)';
  for (let y = 4; y < H; y += 12) for (let x = 4; x < W; x += 12) ui.fillRect(x, y, 6, 6);
  /* 先把词画进离屏，再按格子重新点亮，做出「信号一格格收到」 */
  const tmp = document.createElement('canvas'); tmp.width = W; tmp.height = H;
  const tg = tmp.getContext('2d');
  drawLyric2D(tg, d.rows, { cx: W / 2, cy: H * 0.52, size: d.size, t0: LY.t0, t, fill: '#fff' });
  const img = tg.getImageData(0, 0, W, H).data;
  const reveal = clamp((t - LY.t0) / Math.max(0.3, LY.dur * 0.62), 0, 1);
  const edge = Math.floor(reveal * W);
  for (let y = 0; y < H; y += cell) {
    for (let x = 0; x < W; x += cell) {
      let a = 0;
      if (img[((y + 6) * W + (x + 6)) * 4 + 3] > 60) a = 1;
      if (!a) continue;
      const lit = x < edge;
      ui.fillStyle = lit ? '#ffffff' : 'rgba(255,255,255,.16)';
      ui.fillRect(x, y, cell - 1.5, cell - 1.5);
    }
  }
  if (reveal < 0.999) { ui.fillStyle = 'rgba(255,255,255,.5)'; ui.fillRect(edge - 2, 0, 4, H); }
  mono('00 SIGNAL · CELLS ' + String(Math.round(reveal * 31000)).padStart(5, '0'), 56, 96, 15, 'rgba(255,255,255,.8)');
}

/* ---- 镜头 3：纸面黑字（源片 Kis 那味） ---- */
function shotPaper(t, lt, d) {
  fill(C.paper);
  line(0, H * 0.34, W, H * 0.34, 'rgba(0,0,0,.22)');
  camPunch(d.px, d.py, d.pz, () => {
    drawLyric2D(ui, d.rows, { cx: W / 2, cy: H * 0.55, size: d.size, t0: LY.t0, t, fill: C.ink });
  });
  mono('02/03 — PRESENT TENSE', 56, H * 0.34 - 22, 15, C.ink);
  sparkle(W - 70, H * 0.34 - 30, 18, C.ink, S.beatPhase * 0.3);
}

/* ---- 镜头 4：棋盘格（源片 Checker 那味） ---- */
function shotTiles(t, lt, d) {
  const tw = W / 4, th = H / 3;
  ui.fillStyle = C.ink; ui.fillRect(0, 0, W, H);
  const tmp = document.createElement('canvas'); tmp.width = W; tmp.height = H;
  const tg = tmp.getContext('2d');
  drawLyric2D(tg, d.rows, { cx: W / 2, cy: H * 0.52, size: d.size, t0: LY.t0, t, fill: '#fff' });
  const reveal = clamp((t - LY.t0) / Math.max(0.3, LY.dur * 0.6), 0, 1);
  for (let j = 0; j < 3; j++) {
    for (let i = 0; i < 4; i++) {
      const dark = (i + j) % 2 === 0;
      ui.save();
      ui.beginPath(); ui.rect(i * tw, j * th, tw, th); ui.clip();
      ui.fillStyle = dark ? C.ink : C.paper; ui.fillRect(i * tw, j * th, tw, th);
      ui.globalCompositeOperation = dark ? 'source-over' : 'source-over';
      if (dark) {
        ui.drawImage(tmp, 0, 0);
      } else {
        /* 亮格：把字反相（黑字） */
        ui.filter = 'invert(1)';
        ui.drawImage(tmp, 0, 0);
        ui.filter = 'none';
      }
      ui.restore();
      const vis = clamp(reveal * 12 - (j * 4 + i), 0, 1);
      if (vis < 0.999) { ui.fillStyle = 'rgba(5,5,7,' + ((1 - vis) * 0.9).toFixed(3) + ')'; ui.fillRect(i * tw, j * th, tw, th); }
    }
  }
  ui.strokeStyle = 'rgba(128,128,128,.45)'; ui.lineWidth = 1;
  for (let i = 1; i < 4; i++) line(i * tw, 0, i * tw, H, 'rgba(128,128,128,.45)', 1);
  for (let j = 1; j < 3; j++) line(0, j * th, W, j * th, 'rgba(128,128,128,.45)', 1);
}

/* ---- 镜头 5：环道（源片 Rings 那味） ---- */
function shotRings(t, lt, d) {
  fill('#050507');
  const cx = W / 2, cy = H / 2, R0 = Math.min(W, H) * 0.085;
  const z = 1 + 0.35 * EZ.o2(clamp(d.p, 0, 1));
  ui.save(); ui.translate(cx, cy); ui.scale(z, z);
  for (let k = 8; k >= 0; k--) {
    const r = R0 * Math.pow(1.34, k), white = k % 2 === 0, band = r * 0.15;
    ui.fillStyle = white ? C.paper : '#060608';
    ui.beginPath(); ui.arc(0, 0, r + band, 0, TAU); ui.arc(0, 0, r - band, 0, TAU, true); ui.fill();
    const gg = ui.createLinearGradient(-r, -r, r, r);
    try { gg.addColorStop(0, '#fff'); gg.addColorStop(0.45, '#8890b8'); gg.addColorStop(0.55, '#f4f4ff'); gg.addColorStop(1, '#5b6390'); } catch (e) { }
    ui.strokeStyle = gg; ui.lineWidth = Math.max(2, r * 0.02);
    ui.beginPath(); ui.arc(0, 0, r + band, 0, TAU); ui.stroke();
    ui.strokeStyle = C.blue; ui.lineWidth = Math.max(2, r * 0.045);
    ui.beginPath(); ui.arc(0, 0, r - band - r * 0.05, k + S.beatPhase * 0.6, k + S.beatPhase * 0.6 + 1.1); ui.stroke();
  }
  ui.restore();
  /* 中央暗带托字 */
  const bandH = d.size * (d.rows.length * 1.12 + 1.4);
  const bg2 = ui.createLinearGradient(0, cy - bandH / 2, 0, cy + bandH / 2);
  bg2.addColorStop(0, 'rgba(5,5,7,0)'); bg2.addColorStop(0.22, 'rgba(5,5,7,.82)');
  bg2.addColorStop(0.78, 'rgba(5,5,7,.82)'); bg2.addColorStop(1, 'rgba(5,5,7,0)');
  ui.fillStyle = bg2; ui.fillRect(0, cy - bandH / 2, W, bandH);
  drawLyric2D(ui, d.rows, { cx, cy, size: d.size, t0: LY.t0, t, fill: C.paper });
  mono('03 ARCHIVE · RING 10/10', 56, 96, 15, 'rgba(255,255,255,.75)');
}

/* ---- 镜头 6：空心描边（源片 Ifut 那味） ---- */
function shotOutline(t, lt, d) {
  fill('#050507');
  const g = ui.createRadialGradient(W * 0.5, H * 0.5, 0, W * 0.5, H * 0.5, W * 0.62);
  try { g.addColorStop(0, 'rgba(40,46,120,.30)'); g.addColorStop(1, 'rgba(5,5,7,0)'); } catch (e) { }
  ui.fillStyle = g; ui.fillRect(0, 0, W, H);
  camPunch(d.px, d.py, d.pz, () => {
    drawLyric2D(ui, d.rows, { cx: W / 2, cy: H * 0.52, size: d.size, t0: LY.t0, t,
      stroke: 'rgba(255,255,255,.92)', sw: Math.max(2, d.size * 0.022) });
  });
  mono('00 SIGNAL · OUTLINE', 56, 96, 15, 'rgba(255,255,255,.7)');
  sparkle(W * 0.14 + Math.sin(S.beatPhase * 0.4) * 20, H * 0.26, 26, 'rgba(255,255,255,.9)', S.beatPhase * 0.2);
}

/* 相机：整体推拉 + 回落（2.5D，比真 3D 便宜但观感接近） */
function camPunch(px, py, pz, fn) {
  ui.save();
  ui.translate(W / 2 + px, H / 2 + py);
  ui.scale(pz, pz);
  ui.translate(-W / 2, -H / 2);
  fn();
  ui.restore();
}

const SHOTLIST = [shotSlam, shotChrome, shotWall, shotPaper, shotTiles, shotRings, shotOutline];
const SHOTMETA = [
  { chapter: '01 ACCELERATE', fg: '#fff', field: 'blue' },
  { chapter: '04 ARRIVAL', fg: '#fff', field: 'ink' },
  { chapter: '00 SIGNAL', fg: '#fff', field: 'ink' },
  { chapter: '01 ACCELERATE', fg: C.ink, field: 'paper' },
  { chapter: '02 IGNITION', fg: '#fff', field: 'ink' },
  { chapter: '03 ARCHIVE', fg: '#fff', field: 'ink' },
  { chapter: '00 SIGNAL', fg: '#fff', field: 'ink' },
];

/* 每句开镜时算一次：字号、折行、逐字时间 */
function prepLine(t) {
  const i = S.idx;
  const line = (i >= 0 && i < S.lines.length) ? S.lines[i] : null;
  if (!line) { LY.text = ''; LY.rows = []; LY.chars = []; LY.ready = false; return; }
  LY.text = line.text || '';
  LY.t0 = line.t;
  LY.dur = line.dur > 0.12 ? line.dur : 3.4;
  LY.mode = Math.max(0, i) % SHOTLIST.length;
  LY.chars = normalizeChars(line, LY.text);

  const probe = document.createElement('canvas').getContext('2d');

  /* 画字时逐字有缩放/位移，实际墨迹会比 measureText 宽出一点，这里预留余量 */
  const MAXW = W * 0.78, MAXH = H * 0.54;

  /* 量字和画字必须用同一个 font 字符串，否则字号一定算错（文字会冲出画面）。
     整句只要含一个汉字就走 CJK 栈，纯拉丁走 UB —— 与 drawLyric2D 完全一致。 */
  const hasCJK = /[\u2E80-\u9FFF\uFF00-\uFFEF]/.test(LY.text);
  const fontAt = (px) => `900 ${Math.max(8, Math.round(px))}px ${hasCJK ? CJK : UB}`;

  /* 一行能塞多大？这是字号上界，也是「要不要折行」的判据 */
  probe.font = fontAt(100);
  const emWidth = probe.measureText(LY.text).width / 100;
  const byWidth = MAXW / Math.max(0.001, emWidth);
  const byHeight = MAXH / 1.12;

  let rows, size;
  if (byWidth >= Math.min(byHeight, 150)) {
    rows = [LY.text];
    size = Math.min(byWidth, byHeight);
  } else {
    const nRows = clamp(Math.ceil(byHeight / byWidth), 2, V508.portraitNow ? 3 : 2);
    size = Math.min(MAXH / (nRows * 1.12), byWidth * 1.05);
    rows = wrapLine(LY.text, MAXW, fontAt(size), nRows);
    probe.font = fontAt(size);
    let widest = 0;
    for (const r of rows) widest = Math.max(widest, probe.measureText(r).width);
    if (widest > MAXW) size *= MAXW / widest;
  }

  /* 最后一道保险：按最终字号复核，仍超宽就继续收 */
  probe.font = fontAt(size);
  let finalW = 0;
  for (const r of rows) finalW = Math.max(finalW, probe.measureText(r).width);
  if (finalW > MAXW && finalW > 0) size *= MAXW / finalW;

  LY.rows = rows;
  LY.size = clamp(size, 24, 340);
  LY.ready = true;
}


/* 一句的生命周期结束就重烘 */
let lastPrepIdx = -2;


/* ---------- 主循环：rAF 驱动，时间来自播放头 ---------- */
function drawFrame(t) {
  const i = S.idx;
  const line = (i >= 0 && i < S.lines.length) ? S.lines[i] : null;
  const lt = line ? (t - line.t) : 0;
  const p = line ? clamp(lt / Math.max(0.35, LY.dur), 0, 1) : 0;

  ui.setTransform(1, 0, 0, 1, 0, 0);
  ui.globalAlpha = 1; ui.globalCompositeOperation = 'source-over';

  if (!line) {
    /* 没有歌词：给一个体面的待机画面，不编词 */
    fill('#050507');
    const g = ui.createRadialGradient(W * 0.5, H * 0.5, 0, W * 0.5, H * 0.5, W * 0.5);
    try { g.addColorStop(0, 'rgba(26,43,255,.16)'); g.addColorStop(1, 'rgba(5,5,7,0)'); } catch (e) { }
    ui.fillStyle = g; ui.fillRect(0, 0, W, H);
    const nm = S.title || 'LIZI / 508';
    const rows = wrapLine(nm, 12);
    drawLyric2D(ui, rows, { cx: W / 2, cy: H * 0.5, size: Math.min(H * 0.16, W * 0.09), t0: -99, t, fill: C.paper });
    mono(S.artist || '', W / 2, H * 0.5 + Math.min(H * 0.16, W * 0.09) * (rows.length * 0.62 + 0.7), 15, 'rgba(255,255,255,.5)', { align: 'center' });
    hud(t, '#fff', S.lines.length ? '05 STANDBY' : '05 NO LYRIC');
    return;
  }

  if (S.dirty || lastPrepIdx !== i) { prepLine(t); lastPrepIdx = i; S.dirty = false; }

  const d = { t, p, rows: LY.rows, size: LY.size || 120, px: 0, py: 0, pz: 1 };
  /* 相机：按拍推进的推拉，BPM 一变速度跟着变 */
  const camP = clamp((lt / S.beatSec) / 8, 0, 1);
  d.pz = 1.06 - 0.06 * EZ.o3(clamp(camP * 1.5, 0, 1)) + S.kick * 0.018;
  d.py = (1 - EZ.o3(clamp(camP * 1.5, 0, 1))) * H * 0.04 - S.kick * 3;
  d.px = (rnd(S.beatIndex * 3.7 + Math.floor(S.beatPhase)) - 0.5) * 3 * S.kick;

  const meta = SHOTMETA[LY.mode] || SHOTMETA[0];
  try {
    SHOTLIST[LY.mode](t, lt, d);
  } catch (e) { logErr(e); }

  /* 换句闪白：半拍衰减完 */
  const since = lt;
  const flash = 1 - clamp(since / Math.max(0.06, BT(0.5)), 0, 1);
  if (flash > 0.01 && !RM) {
    ui.setTransform(1, 0, 0, 1, 0, 0);
    ui.globalAlpha = flash * flash * 0.18;
    ui.fillStyle = meta.field === 'paper' ? C.ink : '#fff';
    ui.fillRect(0, 0, W, H);
    ui.globalAlpha = 1;
  }
  hud(t, meta.fg, meta.chapter);
}

function frame(now) {
  const js0 = performance.now();
  try {
    const dt = clamp((now - lastNow) / 1000, 0.0005, 0.12);
    lastNow = now;
    beatTick(dt);

    const t = clockNow();
    S.t = t;
    const i = idxAt(t);
    if (i !== S.idx) { S.idx = i; S.dirty = true; }
    drawFrame(t);
    S.frames++;
  } catch (e) { logErr(e); }
  S.js = performance.now() - js0;
  requestAnimationFrame(frame);
}

let lastNow = performance.now();

/* ---------- 源片 HUD 里的 BPM 数字改成活的 ---------- */
/* hud() 里写的是 '120 BPM' 常量，这里覆盖成实时 BPM */

/* ---------- 字体到位后重排一次 ----------
   首帧 ready 不等字体；但「量字定字号」必须用真字体，否则会按回落字体的
   宽度算出偏大的字号 → 文字冲出画面。所以字体到了强制重排当前句。 */
function refreshFonts() {
  SIG = null;
  S.dirty = true;
  lastPrepIdx = -2;          /* 强制 prepLine 重算 */
  try { if (typeof render === 'function') render(0); } catch (e) { }
}
try {
  if (document.fonts && document.fonts.load) {
    Promise.all([
      document.fonts.load('900 100px UB', 'FUTURE'),
      document.fonts.load('700 20px JBM', '0'),
      document.fonts.load('900 100px HAN', '雨落'),
    ]).then(refreshFonts, refreshFonts);
    if (document.fonts.ready) document.fonts.ready.then(refreshFonts, refreshFonts);
  }
} catch (e) { }

/* ---------- 起跑 ---------- */
requestAnimationFrame(frame);
/* 汉字字形 4MB，ready 之后再拉，绝不堵首帧 */
setTimeout(loadHanFont, 60);

/* 开发者自检口（不是用户可见设置） */
window.__508 = {
  bpm: () => Math.round(S.bpm * 10) / 10,
  beatSec: () => S.beatSec,
  shot: () => LY.mode,
  han: () => HAN_READY,
  lay: () => ({ rows: LY.rows, size: LY.size, mode: LY.mode, n: LY.chars.length }),
};

</script>
</body>
</html>
