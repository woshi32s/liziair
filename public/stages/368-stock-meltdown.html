<!DOCTYPE html>

<canvas id="stageCanvas"></canvas>
<script>
'use strict';

/* ---- 形态设置面板：宿主在 ready 后同步读取，必须先于 ready 声明 ---- */
window.__liziShake = true;
window.__stagePanel = {
  title: '图库事故',
  items: [
    { key: 'shake', label: '震动', type: 'switch', def: true }
  ]
};
addEventListener('message', function (e) {
  var d = e.data;
  if (!d || d.__c100 !== 1 || d.type !== 'setting' || !d.payload) return;
  if (d.payload.key === 'shake') window.__liziShake = d.payload.value !== false;
});

/* ---------- 自检口：脚本最外层，无条件赋值 ---------- */
var stageState = {
  lines: [],
  lineCount: 0,
  lineIndex: -1,
  time: 0,
  playing: true,
  frames: 0,
  frameMs: 0,
  errorText: '',
  lastErrorFrame: 0,
  currentText: '',
  reducedMotion: false
};

window.__stage = function () {
  return {
    lines: stageState.lineCount,
    idx: stageState.lineIndex,
    t: stageState.time,
    playing: stageState.playing,
    frames: stageState.frames,
    js: stageState.frameMs,
    err: stageState.errorText,
    text: stageState.currentText,
    gl: false,
    rm: stageState.reducedMotion
  };
};

var canvasEl = document.getElementById('stageCanvas');
var ctx2d = canvasEl ? canvasEl.getContext('2d') : null;
var viewWidth = 1440;
var viewHeight = 900;
var readySent = false;

/* ---------- 调色板：廉价彩虹 + 封面主色 ---------- */
var accentColor = [255, 92, 200];
var rainbowRamp = [
  [255, 66, 148], [255, 132, 0], [255, 214, 0], [122, 226, 74],
  [0, 208, 236], [124, 106, 255], [236, 84, 224], [255, 66, 148]
];
var reduceMotionQuery = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
stageState.reducedMotion = !!(reduceMotionQuery && reduceMotionQuery.matches);
if (reduceMotionQuery && reduceMotionQuery.addEventListener) {
  reduceMotionQuery.addEventListener('change', function (motionEvent) {
    stageState.reducedMotion = !!motionEvent.matches;
  });
}

var spriteStore = { stock: null, minion: null, brain: null, scribble: null, halftone: null, shadowBlob: null };
var layerReady = { stock: false, minion: false, brain: false, scribble: false, shadowBlob: false };
var bakeQueue = [];
var bakeCursor = 0;
var lastReportAt = 0;
var suppressedReports = 0;
var lyricCache = { key: '', rows: [], pieces: [], fontSize: 0, lineHeight: 0 };
var collageLayout = null;
var liveState = { bpm: 0, level: 0, bass: 0, mid: 0, treble: 0, playing: true };
var beatPulse = 0;
var beatCount = 0;
var lastFrameStamp = 0;
var songTitle = '';
var durationSeconds = 0;

function clampNumber(value, low, high) {
  var number = Number(value);
  if (!isFinite(number)) { return low; }
  return Math.min(high, Math.max(low, number));
}

/* 报错限流：每秒最多一条，避免每帧异常把控制台淹没 */
function reportError(message, error) {
  suppressedReports += 1;
  var now = performance.now();
  if (now - lastReportAt < 1000) { return; }
  lastReportAt = now;
  var count = suppressedReports;
  suppressedReports = 0;
  console.error('[368] ' + message + '（近一秒共 ' + count + ' 次）', error);
}

/* 只允许真正可绘制的图像源进入 drawImage */
function isDrawable(image) {
  return !!image && typeof image === 'object' &&
    typeof image.width === 'number' && typeof image.height === 'number' &&
    image.width > 0 && image.height > 0;
}

function drawLayerSafely(layerName, drawLayer) {
  try {
    drawLayer();
  } catch (layerError) {
    stageState.errorText = String(layerError);
    stageState.lastErrorFrame = stageState.frames;
    reportError('图层绘制失败：' + layerName, layerError);
  }
}

function clampChannel(value) {
  var number = Math.round(Number(value));
  if (!isFinite(number)) { return 0; }
  return Math.min(255, Math.max(0, number));
}

function rgbString(red, green, blue) {
  return 'rgb(' + clampChannel(red) + ',' + clampChannel(green) + ',' + clampChannel(blue) + ')';
}

function rgbaString(red, green, blue, alpha) {
  var safeAlpha = clampNumber(alpha, 0, 1);
  return 'rgba(' + clampChannel(red) + ',' + clampChannel(green) + ',' + clampChannel(blue) + ',' + safeAlpha.toFixed(3) + ')';
}

function rampColor(index, shift, alpha) {
  var size = rainbowRamp.length;
  var base = rainbowRamp[((Math.round(index) + shift) % size + size) % size];
  var amount = clampNumber(alpha, 0, 1);
  return 'rgba(' + clampChannel(base[0]) + ',' + clampChannel(base[1]) + ',' + clampChannel(base[2]) + ',' + amount.toFixed(3) + ')';
}

function makeOffscreen(width, height) {
  var surface = document.createElement('canvas');
  surface.width = Math.max(2, Math.round(width));
  surface.height = Math.max(2, Math.round(height));
  return { canvas: surface, context: surface.getContext('2d') };
}

function makeLinearGradient(context, x0, y0, x1, y1, stops) {
  try {
    var gradient = context.createLinearGradient(x0, y0, x1, y1);
    var ordered = stops.slice().sort(function (left, right) { return left[0] - right[0]; });
    for (var index = 0; index < ordered.length; index += 1) {
      try {
        gradient.addColorStop(clampNumber(ordered[index][0], 0, 1), ordered[index][1]);
      } catch (stopError) {
        reportError('色标写入失败', stopError);
      }
    }
    return gradient;
  } catch (gradientError) {
    reportError('线性渐变创建失败', gradientError);
    return null;
  }
}

function makeRadialGradient(context, x0, y0, r0, x1, y1, r1, stops) {
  try {
    var gradient = context.createRadialGradient(x0, y0, Math.max(0.001, r0), x1, y1, Math.max(0.001, r1));
    var ordered = stops.slice().sort(function (left, right) { return left[0] - right[0]; });
    for (var index = 0; index < ordered.length; index += 1) {
      try {
        gradient.addColorStop(clampNumber(ordered[index][0], 0, 1), ordered[index][1]);
      } catch (stopError) {
        reportError('色标写入失败', stopError);
      }
    }
    return gradient;
  } catch (gradientError) {
    reportError('径向渐变创建失败', gradientError);
    return null;
  }
}

function resizeStage() {
  if (!canvasEl || !ctx2d) {
    reportError('画布不可用', null);
    return;
  }
  var width = Number(window.innerWidth);
  var height = Number(window.innerHeight);
  if (!isFinite(width) || width < 2) { width = 1440; }
  if (!isFinite(height) || height < 2) { height = 900; }
  viewWidth = Math.round(width);
  viewHeight = Math.round(height);
  var ratio = Math.min(2, Math.max(1, window.devicePixelRatio || 1));
  canvasEl.width = Math.round(viewWidth * ratio);
  canvasEl.height = Math.round(viewHeight * ratio);
  ctx2d.setTransform(ratio, 0, 0, ratio, 0, 0);
  buildCollageLayout();
  lyricCache.key = '';
}

function hashUnit(seed) {
  var value = Math.sin(seed * 12.9898 + 78.233) * 43758.5453;
  return value - Math.floor(value);
}

function roundedRectPath(context, x, y, width, height, radius) {
  var safeRadius = clampNumber(radius, 0, Math.min(width, height) / 2);
  context.beginPath();
  context.moveTo(x + safeRadius, y);
  context.lineTo(x + width - safeRadius, y);
  context.quadraticCurveTo(x + width, y, x + width, y + safeRadius);
  context.lineTo(x + width, y + height - safeRadius);
  context.quadraticCurveTo(x + width, y + height, x + width - safeRadius, y + height);
  context.lineTo(x + safeRadius, y + height);
  context.quadraticCurveTo(x, y + height, x, y + height - safeRadius);
  context.lineTo(x, y + safeRadius);
  context.quadraticCurveTo(x, y, x + safeRadius, y);
  context.closePath();
}

/* ---------- 预烘焙：廉价图库握手照 ---------- */

/* ---------- 预烘焙：银河大脑（分块，避免单帧过重） ---------- */
var brainSurface = null;
var brainContext = null;
var brainBlobCursor = 0;
var BRAIN_BLOB_TOTAL = 96;

function beginBrainSurface() {
  brainSurface = makeOffscreen(680, 560);
  brainContext = brainSurface.context;
  brainContext.clearRect(0, 0, 680, 560);
  var disc = makeRadialGradient(brainContext, 340, 280, 40, 340, 280, 300, [
    [0, rgbString(38, 12, 54)], [0.7, rgbString(16, 8, 30)], [1, rgbaString(8, 4, 16, 0.15)]
  ]);
  brainContext.fillStyle = disc || rgbString(24, 10, 38);
  brainContext.beginPath();
  brainContext.arc(340, 280, 268, 0, Math.PI * 2);
  brainContext.fill();
  brainContext.save();
  brainContext.beginPath();
  brainContext.arc(340, 280, 268, 0, Math.PI * 2);
  brainContext.clip();
  brainContext.globalCompositeOperation = 'lighter';
}

function bakeBrainNebulaChunk() {
  if (!brainContext) { return false; }
  var chunkEnd = Math.min(BRAIN_BLOB_TOTAL, brainBlobCursor + 24);
  for (var blobIndex = brainBlobCursor; blobIndex < chunkEnd; blobIndex += 1) {
    var unitA = hashUnit(blobIndex + 3);
    var unitB = hashUnit(blobIndex * 2 + 11);
    var centerX = 120 + unitA * 440;
    var centerY = 120 + unitB * 340;
    var radius = 26 + hashUnit(blobIndex * 5 + 1) * 76;
    var tint = rampColor(blobIndex, 2, 0.11 + hashUnit(blobIndex + 7) * 0.1);
    var glow = makeRadialGradient(brainContext, centerX, centerY, 1, centerX, centerY, radius, [
      [0, tint], [1, rgbaString(0, 0, 0, 0)]
    ]);
    brainContext.fillStyle = glow || tint;
    brainContext.beginPath();
    brainContext.arc(centerX, centerY, radius, 0, Math.PI * 2);
    brainContext.fill();
  }
  brainBlobCursor = chunkEnd;
  if (brainBlobCursor >= BRAIN_BLOB_TOTAL) {
    brainContext.globalCompositeOperation = 'source-over';
    for (var starIndex = 0; starIndex < 90; starIndex += 1) {
      var starX = 80 + hashUnit(starIndex + 21) * 520;
      var starY = 80 + hashUnit(starIndex * 3 + 5) * 400;
      var starSize = 0.9 + hashUnit(starIndex * 7 + 2) * 1.9;
      brainContext.fillStyle = rgbaString(255, 248, 236, 0.55 + hashUnit(starIndex) * 0.4);
      brainContext.beginPath();
      brainContext.arc(starX, starY, starSize, 0, Math.PI * 2);
      brainContext.fill();
    }
    brainContext.restore();
    spriteStore.brain = brainSurface.canvas;
    layerReady.brain = true;
    return true;
  }
  return false;
}

  if (!brainSurface) { return true; }

  paint.bezierCurveTo(-132, 120, -190, 58, -196, -12);
  paint.bezierCurveTo(-208, -108, -120, -206, 0, -186);
  paint.stroke();

  paint.lineWidth = 6;
  paint.globalAlpha = 0.85;
  paint.beginPath();
  paint.moveTo(0, -186);
  paint.lineTo(0, 120);
  paint.stroke();
  paint.beginPath();
  paint.moveTo(-6, -120);
  paint.bezierCurveTo(-92, -140, -132, -66, -112, -2);
  paint.stroke();
  paint.beginPath();
  paint.moveTo(6, -110);
  paint.bezierCurveTo(96, -132, 138, -58, 116, 6);
  paint.stroke();
  paint.beginPath();
  paint.moveTo(-92, 24);
  paint.bezierCurveTo(-136, 54, -108, 104, -54, 110);
  paint.stroke();
  paint.beginPath();
  paint.moveTo(92, 30);
  paint.bezierCurveTo(136, 60, 108, 108, 52, 116);

/* ---------- 歌词层 ---------- */
var lyricFontStack = '"Arial Black", "Microsoft YaHei", "PingFang SC", sans-serif';

function isCjkChar(character) {
  if (!character) { return false; }
  var code = character.charCodeAt(0);
  return (code >= 0x4e00 && code <= 0x9fff) || (code >= 0x3040 && code <= 0x30ff) ||
    (code >= 0xac00 && code <= 0xd7af) || (code >= 0xff00 && code <= 0xff60);
}

function measureCharWidth(character) {
  var measured = ctx2d.measureText(character).width;
  return isFinite(measured) && measured > 0 ? measured : 8;
}

function tokenizeForWrap(text) {
  var tokens = [];
  var buffer = '';
  var bufferStart = -1;
  for (var index = 0; index < text.length; index += 1) {
    var character = text.charAt(index);
    if (isCjkChar(character) || character === ' ') {
      if (buffer) {
        tokens.push({ start: bufferStart, text: buffer });
        buffer = '';
        bufferStart = -1;
      }
      if (character === ' ' && tokens.length > 0) {
        tokens[tokens.length - 1].text += ' ';
      } else {
        tokens.push({ start: index, text: character });
      }
    } else {
      if (!buffer) { bufferStart = index; }
      buffer += character;
    }
  }
  if (buffer) { tokens.push({ start: bufferStart, text: buffer }); }
  return tokens;
}

function wrapTextIntoRows(text, fontSize, maxWidth) {
  ctx2d.font = '900 ' + Math.round(fontSize) + 'px ' + lyricFontStack;
  var measuredTokens = tokenizeForWrap(text);
  var splitTokens = [];
  for (var tokenIndex = 0; tokenIndex < measuredTokens.length; tokenIndex += 1) {
    var token = measuredTokens[tokenIndex];
    var tokenWidth = measureCharWidth(token.text);
    if (tokenWidth > maxWidth && token.text.length > 1) {
      for (var splitIndex = 0; splitIndex < token.text.length; splitIndex += 1) {
        splitTokens.push({ start: token.start + splitIndex, text: token.text.charAt(splitIndex) });
      }
    } else {
      splitTokens.push({ start: token.start, text: token.text });
    }
  }

  var rows = [];
  var currentRow = { tokens: [], width: 0 };
  for (var pieceIndex = 0; pieceIndex < splitTokens.length; pieceIndex += 1) {
    var currentToken = splitTokens[pieceIndex];
    var width = measureCharWidth(currentToken.text);
    if (currentRow.width + width > maxWidth && currentRow.tokens.length > 0) {
      rows.push(currentRow);
      currentRow = { tokens: [], width: 0 };
      if (currentToken.text === ' ') { continue; }
    }
    currentRow.tokens.push({ start: currentToken.start, text: currentToken.text, width: width });
    currentRow.width += width;
  }
  if (currentRow.tokens.length > 0) { rows.push(currentRow); }
  if (rows.length === 0) { rows.push({ tokens: [], width: 0 }); }
  return rows;
}

    var rowCenterY = blockTop + rowIndex * pitch + pitch * 0.5;
    for (var rowTokenIndex = 0; rowTokenIndex < row.tokens.length; rowTokenIndex += 1) {
      var rowToken = row.tokens[rowTokenIndex];
      for (var letterIndex = 0; letterIndex < rowToken.text.length; letterIndex += 1) {
        var character = rowToken.text.charAt(letterIndex);

          index: sourceIndex,

  var panels = [];
  if (portrait) {
    panels.push({ sprite: 'stock', cx: viewWidth * 0.50, cy: viewHeight * 0.155, width: viewWidth * 0.88, aspect: 720 / 520, angle: -0.075, phase: 0.4 });
    panels.push({ sprite: 'minion', cx: viewWidth * 0.20, cy: viewHeight * 0.845, width: viewWidth * 0.30, aspect: 420 / 560, angle: 0.13, phase: 1.9 });
    panels.push({ sprite: 'brain', cx: viewWidth * 0.80, cy: viewHeight * 0.735, width: viewWidth * 0.36, aspect: 680 / 560, angle: 0.10, phase: 3.1 });
  } else {
    panels.push({ sprite: 'stock', cx: viewWidth * 0.205, cy: viewHeight * 0.295, width: Math.min(viewWidth * 0.40, shortSide * 0.62), aspect: 720 / 520, angle: -0.085, phase: 0.4 });
    panels.push({ sprite: 'brain', cx: viewWidth * 0.795, cy: viewHeight * 0.225, width: shortSide * 0.34, aspect: 680 / 560, angle: 0.14, phase: 3.1 });
    panels.push({ sprite: 'minion', cx: viewWidth * 0.815, cy: viewHeight * 0.655, width: shortSide * 0.24, aspect: 420 / 560, angle: 0.10, phase: 1.9 });
  }
  for (var panelIndex = 0; panelIndex < panels.length; panelIndex += 1) {
    var panel = panels[panelIndex];
    panel.height = panel.width / panel.aspect;
    panel.border = makeLinearGradient(ctx2d, -panel.width / 2, -panel.height / 2, panel.width / 2, panel.height / 2, [
      [0, rgbString(255, 66, 148)], [0.25, rgbString(255, 214, 0)], [0.5, rgbString(122, 226, 74)],
      [0.75, rgbString(0, 208, 236)], [1, rgbString(236, 84, 224)]
    ]);
  }

  var stickers = [];
  if (portrait) {
    stickers.push({ text: 'GRAPHIC DESIGN IS MY PASSION', cx: viewWidth * 0.50, cy: viewHeight * 0.285, size: clampNumber(viewWidth * 0.028, 9, 15), angle: -0.06, rampIndex: 1, plaque: true });
    stickers.push({ text: 'SYNERGY™', cx: viewWidth * 0.81, cy: viewHeight * 0.315, size: clampNumber(viewWidth * 0.05, 12, 26), angle: 0.22, rampIndex: 5 });
    stickers.push({ text: '格局打开', cx: viewWidth * 0.19, cy: viewHeight * 0.655, size: clampNumber(viewWidth * 0.045, 11, 24), angle: -0.18, rampIndex: 3 });
    stickers.push({ text: 'NO REFUNDS', cx: viewWidth * 0.72, cy: viewHeight * 0.945, size: clampNumber(viewWidth * 0.036, 10, 19), angle: 0.07, rampIndex: 0 });
    stickers.push({ text: '10X', cx: viewWidth * 0.46, cy: viewHeight * 0.945, size: clampNumber(viewWidth * 0.04, 11, 21), angle: -0.1, rampIndex: 4 });
    stickers.push({ text: 'THIS ↓', cx: viewWidth * 0.62, cy: viewHeight * 0.245, size: clampNumber(viewWidth * 0.042, 11, 22), angle: -0.12, rampIndex: 2 });
    stickers.push({ text: 'so true', cx: viewWidth * 0.30, cy: viewHeight * 0.648, size: clampNumber(viewWidth * 0.038, 10, 20), angle: 0.15, rampIndex: 6 });
  } else {
    stickers.push({ text: 'GRAPHIC DESIGN IS MY PASSION', cx: viewWidth * 0.225, cy: viewHeight * 0.045, size: clampNumber(shortSide * 0.020, 9, 17), angle: -0.03, rampIndex: 1, plaque: true });
    stickers.push({ text: 'SYNERGY™', cx: viewWidth * 0.795, cy: viewHeight * 0.075, size: clampNumber(shortSide * 0.052, 14, 44), angle: 0.10, rampIndex: 5 });
    stickers.push({ text: '格局打开', cx: viewWidth * 0.075, cy: viewHeight * 0.845, size: clampNumber(shortSide * 0.046, 13, 40), angle: -0.16, rampIndex: 3 });
    stickers.push({ text: 'NO REFUNDS', cx: viewWidth * 0.905, cy: viewHeight * 0.885, size: clampNumber(shortSide * 0.032, 10, 28), angle: 0.30, rampIndex: 0 });
    stickers.push({ text: '100% ORGANIC', cx: viewWidth * 0.50, cy: viewHeight * 0.918, size: clampNumber(shortSide * 0.026, 9, 22), angle: -0.04, rampIndex: 4 });
    stickers.push({ text: 'LIVE LAUGH LOVE', cx: viewWidth * 0.315, cy: viewHeight * 0.845, size: clampNumber(shortSide * 0.030, 10, 26), angle: 0.08, rampIndex: 6 });
    stickers.push({ text: 'THIS →', cx: viewWidth * 0.445, cy: viewHeight * 0.135, size: clampNumber(shortSide * 0.028, 10, 25), angle: -0.14, rampIndex: 2 });
    stickers.push({ text: 'so true', cx: viewWidth * 0.585, cy: viewHeight * 0.800, size: clampNumber(shortSide * 0.026, 9, 23), angle: 0.19, rampIndex: 6 });
  }

  collageLayout = { portrait: portrait, shortSide: shortSide, panels: panels, stickers: stickers };
  var marqueeText = 'STOCKPHOTO™ · NO REFUNDS · 100% SYNERGY · 现象级 · ';
  var marqueeSize = Math.round(clampNumber(shortSide * 0.019, 9, 19));
  ctx2d.font = '700 ' + marqueeSize + 'px "Arial Black", "Microsoft YaHei", sans-serif';
  collageLayout.marqueeText = marqueeText;
  collageLayout.marqueeSize = marqueeSize;
  collageLayout.marqueeWidth = Math.max(1, ctx2d.measureText(marqueeText).width);
  for (var stickerBakeIndex = 0; stickerBakeIndex < stickers.length; stickerBakeIndex += 1) {
    try {
      bakeStickerSurface(stickers[stickerBakeIndex]);
    } catch (stickerError) {
      reportError('贴纸烘焙失败', stickerError);
    }
  }
  buildBackdrop();
}

function buildBackdrop() {
  var surface = makeOffscreen(viewWidth, viewHeight);
  var paint = surface.context;
  var baseGradient = makeLinearGradient(paint, 0, 0, viewWidth * 0.35, viewHeight, [
    [0, rgbString(44, 12, 62)], [0.45, rgbString(20, 10, 34)], [1, rgbString(8, 6, 18)]
  ]);
  paint.fillStyle = baseGradient || rgbString(14, 8, 24);
  paint.fillRect(0, 0, viewWidth, viewHeight);

  /* 斜向彩虹条：低配印刷 */
  paint.save();
  paint.translate(viewWidth * 0.5, viewHeight * 0.5);
  paint.rotate(-0.42);
  var bandWidth = Math.max(viewWidth, viewHeight) * 1.6;
  for (var bandIndex = 0; bandIndex < 7; bandIndex += 1) {
    var bandGradient = makeLinearGradient(paint, -bandWidth / 2, 0, bandWidth / 2, 0, [
      [0, rampColor(bandIndex, 0, 0)], [0.5, rampColor(bandIndex, 0, 0.16)], [1, rampColor(bandIndex, 0, 0)]
    ]);
    paint.fillStyle = bandGradient || rampColor(bandIndex, 0, 0.08);
    paint.fillRect(-bandWidth / 2, viewHeight * -0.85 + bandIndex * viewHeight * 0.25, bandWidth, viewHeight * 0.055);
  }
  paint.restore();

  if (spriteStore.halftone) {
    backdropPattern = paint.createPattern(spriteStore.halftone, 'repeat');
  }
  if (backdropPattern) {
    paint.fillStyle = backdropPattern;
    paint.fillRect(0, 0, viewWidth, viewHeight);
  }

  var vignette = makeRadialGradient(paint, viewWidth * 0.5, viewHeight * 0.44, Math.min(viewWidth, viewHeight) * 0.16, viewWidth * 0.5, viewHeight * 0.44, Math.max(viewWidth, viewHeight) * 0.78, [
    [0, rgbaString(0, 0, 0, 0)], [1, rgbaString(4, 2, 10, 0.82)]
  ]);
  paint.fillStyle = vignette || rgbaString(0, 0, 0, 0.4);
  paint.fillRect(0, 0, viewWidth, viewHeight);

  /* 印刷定位线：假装这套视觉是被设计过的 */
  var markInset = Math.max(12, Math.min(viewWidth, viewHeight) * 0.028);
  var markSize = markInset * 0.85;
  paint.strokeStyle = rgbaString(252, 246, 236, 0.32);
  paint.lineWidth = Math.max(1, markInset * 0.06);
  for (var cornerIndex = 0; cornerIndex < 4; cornerIndex += 1) {
    var cornerX = cornerIndex % 2 === 0 ? markInset : viewWidth - markInset;
    var cornerY = cornerIndex < 2 ? markInset : viewHeight - markInset;
    paint.beginPath();
    paint.moveTo(cornerX - markSize, cornerY);
    paint.lineTo(cornerX + markSize, cornerY);
    paint.moveTo(cornerX, cornerY - markSize);
    paint.lineTo(cornerX, cornerY + markSize);
    paint.stroke();
  }
  paint.strokeStyle = rgbaString(252, 246, 236, 0.12);
  paint.strokeRect(markInset * 1.9, markInset * 1.9, viewWidth - markInset * 3.8, viewHeight - markInset * 3.8);
  backdropSurface = surface.canvas;
}

function drawBackdrop(time, level, beatAmount) {
  if (isDrawable(backdropSurface)) {
    ctx2d.drawImage(backdropSurface, 0, 0, viewWidth, viewHeight);
  } else {
    ctx2d.fillStyle = rgbString(14, 8, 24);
    ctx2d.fillRect(0, 0, viewWidth, viewHeight);
  }
  var glowRadius = Math.min(viewWidth, viewHeight) * (0.34 + level * 0.16 + beatAmount * 0.04);
  var glow = makeRadialGradient(ctx2d, viewWidth * 0.5, viewHeight * 0.46, 1, viewWidth * 0.5, viewHeight * 0.46, glowRadius, [
    [0, rampColor(Math.floor(time), 3, 0.32)], [0.45, rampColor(Math.floor(time) + 3, 4, 0.12)],
    [1, rgbaString(0, 0, 0, 0)]
  ]);
  ctx2d.fillStyle = glow || rgbaString(20, 10, 30, 0);
  ctx2d.fillRect(viewWidth * 0.5 - glowRadius, viewHeight * 0.46 - glowRadius, glowRadius * 2, glowRadius * 2);
}

function drawPanel(panel, beatAmount, level) {
  var sprite = spriteStore[panel.sprite];
  var drift = stageState.reducedMotion ? 0 : Math.sin(panel.phase * 2.1 + stageState.time * 0.6) * 2.4;
  var scale = 1 + beatAmount * 0.022 + level * 0.006;
  var width = panel.width * scale;
  var height = panel.height * scale;
  if (!isFinite(width) || !isFinite(height) || width <= 0 || height <= 0) { return; }
  ctx2d.save();
  ctx2d.translate(panel.cx + drift * 0.8, panel.cy + drift * 0.5);
  ctx2d.rotate(panel.angle + (stageState.reducedMotion ? 0 : Math.sin(panel.phase + stageState.time * 0.4) * 0.008));
  if (isDrawable(spriteStore.shadowBlob)) {
    ctx2d.drawImage(spriteStore.shadowBlob, (-width * 1.26) / 2, (-height * 1.26) / 2 + height * 0.10, width * 1.26, height * 1.34);
  } else {
    ctx2d.fillStyle = rgbaString(6, 2, 14, 0.35);
    ctx2d.fillRect(-width / 2 + 6, -height / 2 + 14, width, height);
  }
  if (layerReady[panel.sprite] && isDrawable(sprite)) {
    ctx2d.drawImage(sprite, -width / 2, -height / 2, width, height);
  } else {
    var placeholder = makeLinearGradient(ctx2d, -width / 2, -height / 2, width / 2, height / 2, [
      [0, rgbString(72, 60, 92)], [1, rgbString(34, 28, 48)]
    ]);
    ctx2d.fillStyle = placeholder || rgbString(40, 32, 54);
    roundedRectPath(ctx2d, -width / 2, -height / 2, width, height, 10);
    ctx2d.fill();
    ctx2d.fillStyle = rgbString(240, 232, 255);
    ctx2d.font = '700 ' + Math.round(clampNumber(width * 0.055, 9, 20)) + 'px "Microsoft YaHei", sans-serif';
    ctx2d.textAlign = 'center';
    ctx2d.textBaseline = 'middle';
    ctx2d.fillText('图片走丢了', 0, 0);
  }
  /* 胶带 */
  ctx2d.save();
  ctx2d.rotate(-0.46);
  ctx2d.fillStyle = rgbaString(250, 245, 230, 0.60);
  ctx2d.fillRect(-width * 0.50, -height * 0.55, width * 0.34, height * 0.085);
  ctx2d.restore();
  ctx2d.save();
  ctx2d.rotate(0.38);
  ctx2d.fillStyle = rgbaString(250, 245, 230, 0.42);
  ctx2d.fillRect(width * 0.16, height * 0.42, width * 0.30, height * 0.075);
  ctx2d.restore();

  /* 白色贴纸描边 + 彩虹外框 */
  ctx2d.lineJoin = 'round';
  ctx2d.strokeStyle = rgbString(252, 250, 255);
  ctx2d.lineWidth = Math.max(4, width * 0.012);
  ctx2d.strokeRect(-width / 2, -height / 2, width, height);
  ctx2d.strokeStyle = panel.border || rampColor(2, 0, 1);
  ctx2d.lineWidth = Math.max(6, width * 0.024);
  ctx2d.strokeRect(-width / 2, -height / 2, width, height);
  ctx2d.restore();
}

function drawPanels(beatAmount, level) {
  if (!collageLayout) { return; }
  for (var panelIndex = 0; panelIndex < collageLayout.panels.length; panelIndex += 1) {
    drawPanel(collageLayout.panels[panelIndex], beatAmount, level);
  }
}

function drawStickerLayer(beatAmount) {
  if (!collageLayout) { return; }
  var stickers = collageLayout.stickers;
  for (var stickerIndex = 0; stickerIndex < stickers.length; stickerIndex += 1) {
    var sticker = stickers[stickerIndex];
    if (!isDrawable(sticker.surface)) { continue; }
    var stickerWidth = Number(sticker.logicalWidth);
    var stickerHeight = Number(sticker.logicalHeight);
    if (!isFinite(stickerWidth) || !isFinite(stickerHeight) || stickerWidth <= 0 || stickerHeight <= 0) { continue; }
    var bob = stageState.reducedMotion ? 0 : Math.sin(stickerIndex * 1.7 + stageState.time * 1.1) * 0.035;
    var pulse = 1 + beatAmount * (0.045 + (stickerIndex % 3) * 0.012);
    ctx2d.save();
    ctx2d.translate(sticker.cx, sticker.cy);
    ctx2d.rotate(sticker.angle + bob + beatAmount * 0.006 * (stickerIndex % 2 === 0 ? 1 : -1));
    ctx2d.drawImage(
      sticker.surface,
      (-stickerWidth * pulse) / 2,
      (-stickerHeight * pulse) / 2,
      stickerWidth * pulse,
      stickerHeight * pulse
    );
    ctx2d.restore();
  }
}

function drawWatermarkMarquee(time) {
  if (!collageLayout || !collageLayout.marqueeText) { return; }
  var size = collageLayout.marqueeSize;
  var unit = collageLayout.marqueeWidth;
  var bandHeight = Math.min(viewHeight * 0.062, size * 2.3);
  var bandTop = viewHeight - bandHeight;
  var offset = stageState.reducedMotion ? 0 : -((time * 34) % unit);
  var repeats = Math.min(24, Math.ceil(viewWidth / unit) + 2);
  ctx2d.save();
  ctx2d.fillStyle = rgbaString(7, 4, 14, 0.62);
  ctx2d.fillRect(0, bandTop, viewWidth, bandHeight);
  ctx2d.beginPath();
  ctx2d.rect(0, bandTop, viewWidth, bandHeight);
  ctx2d.clip();
  ctx2d.font = '700 ' + size + 'px "Arial Black", "Microsoft YaHei", sans-serif';
  ctx2d.textAlign = 'left';
  ctx2d.textBaseline = 'middle';
  ctx2d.fillStyle = rgbaString(252, 246, 240, 0.34);
  for (var repeatIndex = 0; repeatIndex < repeats; repeatIndex += 1) {
    ctx2d.fillText(collageLayout.marqueeText, offset + repeatIndex * unit, bandTop + bandHeight * 0.5);
  }
  ctx2d.restore();
}

function drawBeatFlash(beatAmount) {
  if (beatAmount < 0.02 || stageState.reducedMotion) { return; }
  ctx2d.fillStyle = rgbaString(255, 248, 255, 0.05 * beatAmount);
  ctx2d.fillRect(0, 0, viewWidth, viewHeight);
}

function drawSparkle(centerX, centerY, radius, rotation, color) {
  var inner = radius * 0.24;
  ctx2d.save();
  ctx2d.translate(centerX, centerY);
  ctx2d.rotate(rotation);
  ctx2d.beginPath();
  ctx2d.moveTo(0, -radius);
  ctx2d.quadraticCurveTo(inner, -inner, radius, 0);
  ctx2d.quadraticCurveTo(inner, inner, 0, radius);
  ctx2d.quadraticCurveTo(-inner, inner, -radius, 0);
  ctx2d.quadraticCurveTo(-inner, -inner, 0, -radius);
  ctx2d.closePath();
  ctx2d.fillStyle = color;
  ctx2d.fill();
  ctx2d.restore();
}

function drawDoodleLayer(time, beatAmount) {
  if (!collageLayout) { return; }
  var shortSide = collageLayout.shortSide;
  var spin = stageState.reducedMotion ? 0 : time * 0.5;
  var sparkleRadius = shortSide * (0.030 + beatAmount * 0.006);
  drawSparkle(viewWidth * 0.945, viewHeight * 0.315, sparkleRadius, spin, rampColor(2, 0, 0.95));
  drawSparkle(viewWidth * 0.055, viewHeight * 0.585, sparkleRadius * 0.72, -spin * 0.8, rampColor(4, 0, 0.9));
  drawSparkle(viewWidth * 0.365, viewHeight * 0.905, sparkleRadius * 0.5, spin * 1.3, rampColor(0, 0, 0.85));

  ctx2d.save();
  ctx2d.strokeStyle = rgbaString(255, 58, 132, 0.55);
  ctx2d.lineWidth = Math.max(2, shortSide * 0.005);
  ctx2d.lineCap = 'round';
  ctx2d.beginPath();
  ctx2d.moveTo(viewWidth * 0.02, viewHeight * 0.70);
  ctx2d.bezierCurveTo(viewWidth * 0.09, viewHeight * 0.66, viewWidth * 0.05, viewHeight * 0.79, viewWidth * 0.14, viewHeight * 0.755);
  ctx2d.stroke();
  ctx2d.restore();
}

function drawSpectrumStrip(level, beatAmount) {
  var scribble = spriteStore.scribble;
  if (!layerReady.scribble || !isDrawable(scribble)) { return; }
  var barCount = 26;
  var stripTop = viewHeight * 0.855;
  var stripHeight = viewHeight * 0.068;
  var barWidth = viewWidth / barCount;
  var magnitude = clampNumber(level, 0, 1);
  var sourceWidth = 1200 / barCount;
  for (var barIndex = 0; barIndex < barCount; barIndex += 1) {
    var wobble = stageState.reducedMotion ? 0.5 : hashUnit(barIndex * 7 + Math.floor(stageState.time * 3)) * 0.75;
    var barHeight = stripHeight * (0.25 + (0.55 * magnitude + wobble * 0.4) * (0.4 + 0.6 * hashUnit(barIndex + 2)));
    var sourceX = (barIndex / barCount) * 1200;
    if (!isFinite(barHeight) || barHeight <= 0) { continue; }
    ctx2d.drawImage(
      scribble,
      sourceX, 40, sourceWidth, 220,
      barIndex * barWidth, stripTop + stripHeight - barHeight, barWidth + 1, barHeight
    );
  }
}

function drawFrame() {
  stageState.frames += 1;
  var time = stageState.time;
  var level = clampNumber(liveState.level, 0, 1);
  var beatAmount = (window.__liziShake === false) ? 0 : clampNumber(beatPulse, 0, 1);
  drawLayerSafely('背景', function () { drawBackdrop(time, level, beatAmount); });
  drawLayerSafely('拼贴面板', function () { drawPanels(beatAmount, level); });
  drawLayerSafely('涂鸦', function () { drawDoodleLayer(time, beatAmount); });
  drawLayerSafely('贴纸', function () { drawStickerLayer(beatAmount); });
  drawLayerSafely('频谱', function () { drawSpectrumStrip(level, beatAmount); });
  drawLayerSafely('跑马灯', function () { drawWatermarkMarquee(time); });
  drawLayerSafely('歌词', function () { drawLyricLayer(time); });
  drawLayerSafely('闪白', function () { drawBeatFlash(beatAmount); });
}

function normalizeLines(rawLines) {
  var result = [];
  var limit = Math.min(rawLines.length, 4000);
  for (var lineIndex = 0; lineIndex < limit; lineIndex += 1) {
    var rawLine = rawLines[lineIndex];
    if (!rawLine || typeof rawLine !== 'object') { continue; }
    var startTime = Number(rawLine.t);
    if (!isFinite(startTime)) { continue; }
    var lineDuration = Number(rawLine.dur);
    if (!isFinite(lineDuration) || lineDuration < 0) { lineDuration = 0; }
    var text = typeof rawLine.text === 'string' ? rawLine.text : '';
    var rawChars = Array.isArray(rawLine.chars) ? rawLine.chars : null;
    var chars = null;
    if (rawChars && rawChars.length > 0 && text.length > 0) {
      chars = [];
      var charLimit = Math.min(rawChars.length, text.length, 240);
      for (var charIndex = 0; charIndex < charLimit; charIndex += 1) {
        var rawChar = rawChars[charIndex];
        var charTime = rawChar && typeof rawChar === 'object' ? Number(rawChar.t) : NaN;
        if (!isFinite(charTime)) { charTime = startTime + (lineDuration * charIndex) / Math.max(1, charLimit); }
        chars.push({ c: text.charAt(charIndex), t: charTime });
      }
      if (chars.length !== text.length) { chars = null; }
    }
    result.push({ t: startTime, dur: lineDuration, text: text, chars: chars });
  }
  result.sort(function (left, right) { return left.t - right.t; });
  return result;
}

function animationLoop() {
  var startMs = performance.now();
  try {
    if (readySent) {
      runBakeBudget(5);
    }
    var deltaSeconds = Math.min(0.25, Math.max(0, (startMs - lastFrameStamp) / 1000));
    lastFrameStamp = startMs;
    beatPulse = Math.max(0, beatPulse - deltaSeconds * 2.6);
    stageState.lineIndex = pickLineIndex(stageState.time);
    var activeLine = stageState.lineIndex >= 0 ? stageState.lines[stageState.lineIndex] : null;
    stageState.currentText = activeLine && typeof activeLine.text === 'string' ? activeLine.text : '';
    drawFrame();
  } catch (error) {
    stageState.errorText = String(error);
    stageState.lastErrorFrame = stageState.frames;
    reportError('帧渲染异常', error);
  }
  if (stageState.errorText && stageState.frames - stageState.lastErrorFrame > 90) {
    stageState.errorText = '';
  }
  stageState.frameMs = performance.now() - startMs;
  requestAnimationFrame(animationLoop);
}

function handleMessage(event) {
  var data = event && event.data;
  if (!data || data.__c100 !== 1) { return; }
  try {
    if (data.type === 'init') {
      var payload = data.payload || {};
      var song = payload.song && typeof payload.song === 'object' ? payload.song : {};
      var rawLines = Array.isArray(payload.lines) ? payload.lines : [];
      stageState.lines = normalizeLines(rawLines);
      stageState.lineCount = stageState.lines.length;
      stageState.currentText = '';
      lyricCache.key = '';
      if (Array.isArray(payload.accent) && payload.accent.length >= 3) {
        accentColor = [clampChannel(payload.accent[0]), clampChannel(payload.accent[1]), clampChannel(payload.accent[2])];
        rainbowRamp[7] = accentColor.slice(0, 3);
      }
      songTitle = typeof song.name === 'string' ? song.name : '';
      durationSeconds = clampNumber(payload.duration, 0, 100000);
      stageState.playing = payload.playing !== false;
    } else if (data.type === 'tick') {
      var tickPayload = data.payload || {};
      var tickTime = Number(tickPayload.time);
      stageState.time = isFinite(tickTime) ? tickTime : stageState.time;
      stageState.playing = tickPayload.playing !== false;
    } else if (data.type === 'beat') {
      var beatPayload = data.payload || {};
      beatCount += 1;
      beatPulse = 1;
      liveState.level = Math.max(liveState.level, clampNumber(beatPayload.level, 0, 1));
    } else if (data.type === 'live') {
      var livePayload = data.payload || {};
      liveState.bpm = clampNumber(livePayload.bpm, 0, 400);
      liveState.level = clampNumber(livePayload.level, 0, 1);
      liveState.bass = clampNumber(livePayload.bass, 0, 1);
      liveState.mid = clampNumber(livePayload.mid, 0, 1);
      liveState.treble = clampNumber(livePayload.treble, 0, 1);
      liveState.playing = livePayload.playing !== false;
    }
  } catch (error) {
    stageState.errorText = String(error);
    stageState.lastErrorFrame = stageState.frames;
    reportError('消息处理异常', error);
  }
}

var resizeTimer = 0;

function scheduleResize() {
  if (resizeTimer) { clearTimeout(resizeTimer); }
  resizeTimer = setTimeout(function () {
    resizeTimer = 0;
    try {
      resizeStage();
    } catch (resizeError) {
      reportError('重排失败', resizeError);
    }
  }, 110);
}

bakeHalftoneTile();
queueBakeTasks();
resizeStage();
window.addEventListener('resize', scheduleResize);
window.addEventListener('message', handleMessage);

requestAnimationFrame(function firstFrame() {
  sendReady();
  animationLoop();
});
setTimeout(sendReady, 900);
</script>
